<meta charset="UTF-8" />

<title>Palabra — Try it free</title>

<!-- No manifest/apple-touch-icon links here on purpose — this page is a
     one-time, no-account demo for first-time visitors, not something that
     should ever be offered for home-screen install as its own app
     identity. No xlsx.full.min.js either — the demo never parses a
     spreadsheet; its word pool is hardcoded and its progress is a
     throwaway in-memory object (see demo-boot.js). Deliberately left out
     of service-worker.js's asset list too, and no service worker is
     registered from this page — it's a one-time funnel page, not part of
     the installed offline app.

     Still no firebase-auth.js and no Firebase SDK: there's no account here
     to authenticate. The funnel telemetry added below does write to
     Firestore, but over the plain REST API via fetch() precisely so this
     page stays SDK-free — load time on an ad landing page is the thing
     paid clicks are most sensitive to. -->

<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/quiz.css" />
<link rel="stylesheet" href="../css/hub.css" />
<link rel="stylesheet" href="../css/celebration.css" />
<link rel="stylesheet" href="../css/progress.css" />
<link rel="stylesheet" href="../css/daily-double.css" />

</head>
<body>
<div id="app"></div>

<!-- Reused, completely unmodified from the main app. Deliberately NOT
     loaded: auth.js, cloud-sync.js, firebase-auth.js (no account exists
     yet), data-loading.js (word pool is hardcoded below, never fetched,
     and the read-only browse layer below never calls into any of the
     data-loading-dependent functions that would otherwise need it),
     render-auth.js (signup is a real page navigation to ../index.html,
     never rendered in-page here), app-boot.js (replaced by demo-boot.js).

     2026-08-28 (read-only "explore the app" layer): now ALSO loading
     conjugation-engine.js, game-timeattack.js, game-memory.js,
     game-conjugate.js, render-timeattack.js, render-memory.js,
     render-conjugate.js, render-progress.js, and navigation.js — all
     completely unmodified from the main app, same files it uses. Needed
     so a demo visitor can freely browse Time Attack/Memory Match setup,
     My Progress, and Achievements, and so hardware/gesture back-button
     history works the same proven way it does in the real app (see
     navigation.js's own header comment — it must load after all four
     game-*.js files, which is why it's placed last below, right before
     demo-boot.js). Conjugate's own setup/play screens are loaded for
     parity and because navigation.js's BACK_QUIT_HANDLERS references
     quitConjugateRound by name at parse time, but demo-boot.js's click-
     gate never actually lets a demo visitor reach conjugate-setup (see
     its own comment) — this demo's hardcoded word list has no
     conjugation-tagged data for that screen to show. -->
<script src="../js/config.js"></script>
<!-- Funnel telemetry — shared with the real app, which loads the same file
     to record the last two events (signup page reached, account created)
     after this page navigates away. Defines functions only; nothing runs
     until demo-boot.js starts a session. -->
<script src="../js/demo-telemetry.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/progress-xp.js"></script>
<script src="../js/achievements.js"></script>
<script src="../js/word-selection.js"></script>
<script src="../js/conjugation-engine.js"></script>
<script src="../js/game-quiz.js"></script>
<script src="../js/game-timeattack.js"></script>
<script src="../js/game-memory.js"></script>
<script src="../js/game-conjugate.js"></script>
<script src="../js/views/render-quiz.js"></script>
<script src="../js/views/render-hub.js"></script>
<script src="../js/views/render-timeattack.js"></script>
<script src="../js/views/render-memory.js"></script>
<script src="../js/views/render-conjugate.js"></script>
<script src="../js/views/render-progress.js"></script>
<script src="../js/views/render-dispatch.js"></script>
<!-- MUST load after all four game-*.js files above (see its own header
     comment) — back-button/history handling, completely unmodified from
     the main app. -->
<script src="../js/navigation.js"></script>

<!-- Demo-only: builds the throwaway state object, the fixed 8-question
     round, small safe overrides (saveProgress/nextQuestion), the funnel
     telemetry taps, the signup handoff, and the read-only-browse click
     gate. Loads last — see its own top comment. -->
<script src="demo-boot.js"></script>
</body>
</html>
