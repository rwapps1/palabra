<script>
/* ============================================================
   PALABRA — STREAM TEST BUILD
   Real login (existing accounts only), real word list from the
   repo, real box-weighted word selection. Progress in this build
   is LOCAL ONLY (localStorage, key below) — it never reads or
   writes your real Firestore progress doc.
   ============================================================ */

const WORDS_FILE = 'words.xlsx';
const TEST_STORAGE_KEY = 'palabra-stream-test-progress-v1';
const CHECKPOINT_EVERY = 10;
const SRS_INTERVALS_DAYS = [0, 1, 3, 7, 16, 35];
const FORMATS = ['mc', 'audio', 'type'];

const XP_LEVEL_BASE_SPAN = 100;
const XP_LEVEL_GROWTH = 1.15;
const XP_PER_QUIZ_CORRECT = 1;
const XP_PER_BEST_STREAK_POINT = 2;

const state = {
  screen: 'loading',
  user: null,
  authError: '',
  authBusy: false,
  pairs: [],
  loading: true,
  error: '',
  showUpload: false,
  progress: null,
  // stream runtime
  sIndex: 0, sStreak: 0, sBestStreak: 0, sCorrect: 0, sResults: [], checkpointResults: [],
  lastWordKey: null,
};

/* ---------- helpers copied verbatim from index.html's logic ---------- */
function normalize(str) { return str.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function splitAnswers(cell) { return cell.toString().split(/[/;,]/).map(s => s.trim()).filter(Boolean); }
function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wordKey(pair) { return normalize(pair.es) + '::' + normalize(pair.en); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function getWeight(pair) {
  const stats = state.progress.wordStats[wordKey(pair)];
  const now = Date.now();
  if (!stats) return 12;
  const overdueMs = now - (stats.nextDue || 0);
  if (overdueMs >= 0) { const overdueDays = overdueMs / 86400000; return 6 + Math.min(overdueDays, 12) * 1.5; }
  const daysUntilDue = -overdueMs / 86400000;
  return Math.max(0.2, 3 / (1 + daysUntilDue * 2));
}

function weightedPickOne(items, excludeKey) {
  let pool = items;
  if (excludeKey && items.length > 1) {
    const filtered = items.filter(p => wordKey(p) !== excludeKey);
    if (filtered.length > 0) pool = filtered;
  }
  const weights = pool.map(p => Math.max(getWeight(p), 0.0001));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function getDistractors(pool, current, targetIsEn, count) {
  const seen = new Set([normalize(targetIsEn ? current.en : current.es)]);
  const candidates = [];
  pool.forEach(p => {
    if (wordKey(p) === wordKey(current)) return;
    const text = splitAnswers(targetIsEn ? p.en : p.es)[0];
    if (!text) return;
    const n = normalize(text);
    if (seen.has(n)) return;
    seen.add(n);
    candidates.push(text);
  });
  return shuffle(candidates).slice(0, count);
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n; if (n === 0) return m;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= n; j++) { const t = dp[j]; dp[j] = a[i-1]===b[j-1] ? prev : 1+Math.min(prev,dp[j],dp[j-1]); prev = t; }
  }
  return dp[n];
}
function isCloseMatch(u, a) { if (!u || !a) return false; if (u === a) return true; const d = levenshtein(u,a); const len = Math.max(u.length,a.length); return d <= Math.max(1, Math.round(len*0.4)); }
function isAnswerCorrect(input, targetField) {
  const userNorm = normalize(input);
  if (userNorm.length === 0) return false;
  const acceptable = splitAnswers(targetField).map(normalize);
  if (acceptable.includes(userNorm)) return true;
  return acceptable.some(a => isCloseMatch(userNorm, a));
}

function computeXP(progress) {
  let xp = 0;
  xp += progress.lifetime.totalCorrect * XP_PER_QUIZ_CORRECT;
  xp += progress.streak.best * XP_PER_BEST_STREAK_POINT;
  return Math.round(xp);
}
function getXPLevel(progress) {
  const xp = computeXP(progress);
  let span = XP_LEVEL_BASE_SPAN, cumulative = 0, level = 1;
  while (cumulative + span <= xp) { cumulative += span; level += 1; span = Math.round(span * XP_LEVEL_GROWTH); }
  const xpIntoLevel = xp - cumulative;
  const pct = Math.max(0, Math.min(100, Math.round((xpIntoLevel / span) * 100)));
  return { xp, level, xpIntoLevel, xpForNextLevel: span, pct };
}

function extractPairsFromRows(rows, skipHeader) {
  const startIdx = skipHeader ? 1 : 0;
  const cleaned = [];
  for (let i = startIdx; i < rows.length; i++) {
    const row = rows[i]; if (!row) continue;
    const es = (row[0] ?? '').toString().trim();
    const en = (row[1] ?? '').toString().trim();
    if (es && en) cleaned.push({ es, en });
  }
  return cleaned;
}

/* ---------- local (isolated) test progress ---------- */
function defaultTestProgress() {
  return { wordStats: {}, streak: { current: 0, best: 0 }, lifetime: { totalAnswered: 0, totalCorrect: 0 } };
}
function loadTestProgress() {
  try {
    const raw = localStorage.getItem(TEST_STORAGE_KEY);
    if (raw) return Object.assign(defaultTestProgress(), JSON.parse(raw));
  } catch (e) {}
  return defaultTestProgress();
}
function saveTestProgress() {
  try { localStorage.setItem(TEST_STORAGE_KEY, JSON.stringify(state.progress)); } catch (e) {}
}
function resetTestProgress() {
  state.progress = defaultTestProgress();
  saveTestProgress();
  render();
}

/* ---------- speech (verbatim from index.html) ---------- */
function speak(text, lang, btnEl) {
  if (!('speechSynthesis' in window)) return;
  try {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang; utter.rate = 0.95;
    if (btnEl) {
      utter.onstart = () => btnEl.classList.add('speaking');
      utter.onend = () => btnEl.classList.remove('speaking');
      utter.onerror = () => btnEl.classList.remove('speaking');
    }
    setTimeout(() => { try { window.speechSynthesis.speak(utter); } catch (e) {} }, 50);
  } catch (e) {}
}

/* ---------- word list loading (mirrors index.html) ---------- */
async function loadFromRepo() {
  state.loading = true; render();
  try {
    const resp = await fetch(WORDS_FILE);
    if (!resp.ok) throw new Error('File not found: ' + resp.status);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    const cleaned = extractPairsFromRows(rows, true);
    if (cleaned.length === 0) throw new Error('No word pairs found');
    state.pairs = cleaned;
    state.loading = false;
    state.screen = 'home';
    render();
  } catch (err) {
    state.loading = false;
    state.showUpload = true;
    state.error = `Couldn't load "${WORDS_FILE}" automatically. Upload it manually below.`;
    render();
  }
}

function handleManualUpload(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const cleaned = extractPairsFromRows(rows, true);
      if (cleaned.length === 0) { state.error = 'No word pairs found in that file.'; render(); return; }
      state.pairs = cleaned; state.error = ''; state.showUpload = false; state.screen = 'home';
      render();
    } catch (err) { state.error = 'Could not read that file.'; render(); }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- STREAM ---------- */
function startStream() {
  state.sIndex = 0; state.sStreak = 0; state.sBestStreak = 0; state.sCorrect = 0;
  state.sResults = []; state.checkpointResults = []; state.lastWordKey = null;
  state.screen = 'stream';
  renderQuestion();
}

function renderTiles() {
  let html = '';
  for (let i = 0; i < CHECKPOINT_EVERY; i++) {
    let bg = 'var(--outline)';
    if (i < state.checkpointResults.length) bg = state.checkpointResults[i] ? '#2DD4BF' : '#FF4D6D';
    else if (i === state.checkpointResults.length) bg = '#FFC163';
    html += `<div class="tile" style="background:${bg}"></div>`;
  }
  return html;
}

let currentQ = null;

function renderQuestion() {
  const app = document.getElementById('app');
  const word = weightedPickOne(state.pairs, state.lastWordKey);
  state.lastWordKey = wordKey(word);
  const type = FORMATS[state.sIndex % FORMATS.length];
  const direction = Math.random() < 0.5 ? 'es-en' : 'en-es';
  currentQ = { word, type, direction };

  let cardInner = '', bottomHtml = '';
  let opts = null, answerWord = '', promptWord = '', targetField = '', promptLang = '';

  if (type === 'mc') {
    promptWord = direction === 'es-en' ? splitAnswers(word.es)[0] : splitAnswers(word.en)[0];
    answerWord = direction === 'es-en' ? splitAnswers(word.en)[0] : splitAnswers(word.es)[0];
    promptLang = direction === 'es-en' ? 'es-ES' : 'en-US';
    const distractors = getDistractors(state.pairs, word, direction === 'es-en', 2);
    opts = shuffle([answerWord, ...distractors]);
    cardInner = `<div class="prompt-row"><div class="prompt-word">${esc(promptWord)}</div><button class="speak-btn" id="speak-btn">🔊</button></div>`;
    bottomHtml = `<div class="option-list" id="opt-wrap">` + opts.map((o,i) => `<button class="option-btn" data-opt="${i}">${esc(o)}</button>`).join('') + `</div>`;
  } else if (type === 'audio') {
    promptWord = splitAnswers(word.es)[0]; // what's actually spoken
    answerWord = splitAnswers(word.en)[0];
    promptLang = 'es-ES';
    const distractors = getDistractors(state.pairs, word, true, 2);
    opts = shuffle([answerWord, ...distractors]);
    cardInner = `<button class="speak-btn big" id="speak-btn">🔊</button><div class="audio-hint">Escucha y elige</div>`;
    bottomHtml = `<div class="option-list" id="opt-wrap">` + opts.map((o,i) => `<button class="option-btn" data-opt="${i}">${esc(o)}</button>`).join('') + `</div>`;
  } else if (type === 'type') {
    promptWord = direction === 'es-en' ? splitAnswers(word.es)[0] : splitAnswers(word.en)[0];
    promptLang = direction === 'es-en' ? 'es-ES' : 'en-US';
    targetField = direction === 'es-en' ? word.en : word.es;
    cardInner = `<div class="prompt-row"><div class="prompt-word">${esc(promptWord)}</div><button class="speak-btn" id="speak-btn">🔊</button></div>`;
    bottomHtml = `<input type="text" id="type-input" placeholder="Type the translation…" autocomplete="off" /><button class="btn-primary" id="check-btn">Check</button>`;
  }

  const dirLabel = type === 'audio' ? 'ESCUCHA' : (direction === 'es-en' ? 'ES → EN' : 'EN → ES');

  app.innerHTML = `
    <div class="screen bg-stream">
      <div class="wrap">
        <div class="tiles" style="grid-template-columns: repeat(${CHECKPOINT_EVERY}, 1fr);">${renderTiles()}</div>

        </div>

        <button class="quit-link" style="display:block; text-align:center; width:100%; margin-top:14px;" id="quit-btn">Quit</button>
      </div>
    </div>
  `;

  // Bind everything now that the markup above actually exists in the DOM —
  // no setTimeout needed, this runs synchronously right after innerHTML.
  document.getElementById('quit-btn').addEventListener('click', () => { state.screen = 'home'; render(); });

  const speakBtn = document.getElementById('speak-btn');
  if (speakBtn) {
    speakBtn.addEventListener('click', () => speak(promptWord, promptLang, speakBtn));
    // mc/type respect the same "on by default" auto-speak behavior as index.html;
    // audio always auto-plays regardless, since listening *is* the exercise.
    speak(promptWord, promptLang, speakBtn);
  }

  if (type === 'mc' || type === 'audio') {
    document.querySelectorAll('#opt-wrap .option-btn').forEach(b => {
      b.addEventListener('click', () => answerMC(opts[+b.dataset.opt], answerWord));
    });
  } else if (type === 'type') {
    const input = document.getElementById('type-input');
    input.focus();
    document.getElementById('check-btn').addEventListener('click', () => answerType(input.value, targetField, promptWord));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') answerType(input.value, targetField, promptWord); });
  }
}

function lockOptions() { document.querySelectorAll('#opt-wrap .option-btn').forEach(b => b.disabled = true); }

function answerMC(chosen, correctAnswer) {
  lockOptions();
  const isCorrect = normalize(chosen) === normalize(correctAnswer);
  document.querySelectorAll('#opt-wrap .option-btn').forEach(b => {
    if (normalize(b.textContent) === normalize(correctAnswer)) b.classList.add('correct-choice', 'pop-anim');
    else if (normalize(b.textContent) === normalize(chosen) && !isCorrect) b.classList.add('wrong-choice', 'shake-anim');
  });
  recordAndSettle(isCorrect, isCorrect ? 750 : 1600);
}

function answerType(input, targetField, promptWord) {
  const btn = document.getElementById('check-btn');
  if (btn) btn.disabled = true;
  document.getElementById('type-input').disabled = true;
  const isCorrect = isAnswerCorrect(input, targetField);
  recordAndSettle(isCorrect, isCorrect ? 750 : 1800);
}

function recordAndSettle(isCorrect, delay) {
  const { word } = currentQ;
  const key = wordKey(word);
  if (!state.progress.wordStats[key]) state.progress.wordStats[key] = { box: 0, nextDue: 0, right: 0, wrong: 0, lastSeen: 0 };
  const ws = state.progress.wordStats[key];
  const now = Date.now();
  ws.lastSeen = now;
  if (isCorrect) {
    ws.right += 1;
    ws.box = Math.min((ws.box || 0) + 1, SRS_INTERVALS_DAYS.length - 1);
    ws.nextDue = now + SRS_INTERVALS_DAYS[ws.box] * 86400000;
    state.progress.streak.current += 1;
    if (state.progress.streak.current > state.progress.streak.best) state.progress.streak.best = state.progress.streak.current;
    state.sStreak++; state.sCorrect++;
    state.sBestStreak = Math.max(state.sBestStreak, state.sStreak);
  } else {
    ws.wrong += 1; ws.box = 0; ws.nextDue = now;
    state.progress.streak.current = 0;
    state.sStreak = 0;
  }
  state.progress.lifetime.totalAnswered += 1;
  if (isCorrect) state.progress.lifetime.totalCorrect += 1;
  saveTestProgress();

  state.sResults.push({ correct: isCorrect });
  state.checkpointResults.push(isCorrect);
  state.sIndex++;

  setTimeout(() => {
    if (state.checkpointResults.length >= CHECKPOINT_EVERY) { state.screen = 'checkpoint'; render(); }
    else renderQuestion();
  }, delay);
}

/* ---------- keyboard-safe scrolling (same fix as index.html) ---------- */
// interactive-widget=resizes-content shrinks the viewport around the
// keyboard, but only guarantees the *focused* input scrolls into view —
// not the Check/Sign in button after it. Walk forward from whatever's
// focused until a primary/secondary action button turns up, and bring
// that into view instead.
function findNextActionButton(el, hops) {
  if (!el || hops > 8) return null;
  let node = el;
  while (node) {
    const sib = node.nextElementSibling;
    if (sib) {
      if (sib.tagName === 'BUTTON' && (sib.classList.contains('btn-primary') || sib.classList.contains('btn-secondary'))) return sib;
      const nested = sib.querySelector && sib.querySelector('.btn-primary, .btn-secondary');
      if (nested) return nested;
      node = sib;
    } else {
      node = node.parentElement;
      if (!node || node.id === 'app') return null;
    }
  }
  return null;
}
function scrollKeyboardTargetIntoView(active) {
  if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA')) return;
  const target = findNextActionButton(active, 0) || active;
  target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
// Two independent triggers on purpose — a single heuristic (viewport gap)
// already failed once here, since resizes-content shrinks layout and
// visual viewport together and leaves no gap to detect.
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    setTimeout(() => scrollKeyboardTargetIntoView(document.activeElement), 80);
  });
}
document.addEventListener('focusin', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    setTimeout(() => scrollKeyboardTargetIntoView(e.target), 350);
  }
});

/* ---------- boot ---------- */
window.addEventListener('palabra-firebase-ready', () => {
  window.PalabraAuth.onAuthStateChanged((user) => {
    state.user = user;
    if (user) {
      state.progress = loadTestProgress();
      loadFromRepo();
    } else {
      state.screen = 'login';
      render();
    }
  });
});
render();
</script>
</body>
</html>
