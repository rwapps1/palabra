<!-- Firebase: Authentication + Firestore. This runs as an ES module, so it
     can't share scope directly with the classic app script further down —
     instead it publishes what's needed onto window.PalabraAuth and fires a
     'palabra-firebase-ready' event once that's done, since module scripts
     load asynchronously and may not be ready before the classic script's
     boot code runs. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth, onAuthStateChanged,
    createUserWithEmailAndPassword, signInWithEmailAndPassword,
    GoogleAuthProvider, signInWithRedirect, getRedirectResult,
    sendPasswordResetEmail,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBa47dn0gfyqYtF07i7EEsUCJtYIPZs5NM",
    authDomain: "palabra-f8778.firebaseapp.com",
    projectId: "palabra-f8778",
    storageBucket: "palabra-f8778.firebasestorage.app",
    messagingSenderId: "291018112525",
    appId: "1:291018112525:web:2e53769bf8952131e19f44"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  window.PalabraAuth = {
    onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
    signUp: (email, password) => createUserWithEmailAndPassword(auth, email, password),
    signIn: (email, password) => signInWithEmailAndPassword(auth, email, password),
    resetPassword: (email) => sendPasswordResetEmail(auth, email),
    signInWithGoogle: () => signInWithRedirect(auth, googleProvider),
    getRedirectResult: () => getRedirectResult(auth),
    signOut: () => signOut(auth),
    getUserDoc: (uid) => getDoc(doc(db, 'users', uid)),
    setUserDoc: (uid, data) => setDoc(doc(db, 'users', uid), data, { merge: true }),
    serverTimestamp
  };

  window.dispatchEvent(new CustomEvent('palabra-firebase-ready'));
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #100A1E;
    --bg-card: rgba(255,255,255,0.07);
    --bg-card-alt: rgba(255,255,255,0.12);
    --ochre: #FFC163;
    --terracotta: #FF4D6D;
    --cream: #F7F3ED;
    --cream-dim: #B8AFC9;
    --green: #2DD4BF;
    --red: #FF4D6D;
    --outline: rgba(255,255,255,0.16);
    --label: #C9A8FF;
    --memory: #E879F9;
    --conjugate: #34D399;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 20px;
  }
  .upload-screen { justify-content: center; }

  /* Ambient per-mode gradient glow — the color itself signals which mode you're in */

    background:
      radial-gradient(circle at 25% 15%, rgba(255,107,74,0.42), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(139,92,246,0.32), transparent 50%),
      linear-gradient(160deg, #1B1030 0%, #150C26 60%, #100A1E 100%);
  }
  .bg-timeattack {
    background:
      radial-gradient(circle at 20% 20%, rgba(45,212,191,0.4), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(56,120,255,0.3), transparent 50%),
      linear-gradient(160deg, #0D1B30 0%, #0B1626 60%, #0A121E 100%);
  }
  .bg-achievements {
    background:
      radial-gradient(circle at 25% 20%, rgba(255,193,99,0.4), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(255,107,74,0.25), transparent 50%),
      linear-gradient(160deg, #241631 0%, #1A1026 60%, #120B1C 100%);
  }
  .bg-memory {
    background:
      radial-gradient(circle at 22% 18%, rgba(217,70,239,0.38), transparent 45%),
      radial-gradient(circle at 85% 78%, rgba(99,102,241,0.3), transparent 50%),
      linear-gradient(160deg, #240F35 0%, #180B28 60%, #100A1E 100%);
  }
  .bg-conjugate {
    background:
      radial-gradient(circle at 22% 18%, rgba(52,211,153,0.36), transparent 45%),
      radial-gradient(circle at 85% 78%, rgba(217,119,6,0.26), transparent 50%),
      linear-gradient(160deg, #0E2A22 0%, #0B1F1A 60%, #0A1512 100%);
  }
  /* My Progress is reflective, not active gameplay, so it gets a calmer
     violet-cream glow rather than a vibrant mode color. */

    background:
      radial-gradient(circle at 20% 15%, rgba(201,168,255,0.32), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(247,243,237,0.14), transparent 50%),
      linear-gradient(160deg, #1A1530 0%, #140F26 60%, #100A1E 100%);
  }
  .bg-login {
    background:
      radial-gradient(circle at 50% 12%, rgba(198,11,30,0.38), transparent 45%),
      radial-gradient(circle at 80% 82%, rgba(139,92,246,0.28), transparent 50%),
      linear-gradient(160deg, #1B1030 0%, #150C26 60%, #100A1E 100%);
  }

  .wordmark-accent { color: #FFFFFF; }

  .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .auth-tab {
    flex: 1;
    padding: 10px 0;
    border-radius: 16px;
    border: 1px solid var(--outline);
    background: rgba(255,255,255,0.06);
    color: var(--cream-dim);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .auth-tab.active { background: var(--ochre); color: #241608; border-color: var(--ochre); }

  .login-screen .prompt-card { padding: 24px 20px; text-align: left; }
  .login-screen .btn-secondary { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }

  .auth-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 16px 0; color: var(--cream-dim); font-size: 12px;
  }
  .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--outline); }

  #confirm-field, #username-field {
    max-height: 0; overflow: hidden; opacity: 0; margin-bottom: 0;
    transition: max-height 0.25s ease, opacity 0.2s ease, margin-bottom 0.25s ease;
  }
  #confirm-field.shown, #username-field.shown { max-height: 90px; opacity: 1; margin-bottom: 12px; }

  .wrap { width: 100%; max-width: 420px; perspective: 700px; position: relative; }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 2px;
    color: var(--label);
    text-transform: uppercase;
    text-align: center;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 10px 0 4px;
  }
  /* The one deliberate flag nod: a glass medallion banded rojo-oro-rojo */
  .badge {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(180deg, #C60B1E 0 25%, #FFC400 25% 75%, #C60B1E 75% 100%);
    box-shadow: 0 0 20px rgba(255,196,0,0.45), inset 0 2px 3px rgba(255,255,255,0.45), inset 0 -3px 6px rgba(0,0,0,0.3);
    position: relative;
    flex-shrink: 0;
  }
  .badge::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 33% 25%, rgba(255,255,255,0.6), transparent 55%);

  h1 {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0;
    line-height: 1.1;
    text-align: center;
  }
  .sub {
    color: var(--cream-dim);
    font-size: 15px;
    line-height: 1.5;
    text-align: center;

  .card {
    background: var(--bg-card);
    border-radius: 22px;
    padding: 18px;
    border: 1px solid var(--outline);

    -webkit-backdrop-filter: blur(18px);

  .menu-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--outline);
    background: rgba(255,255,255,0.06);
    color: var(--cream);
    font-size: 18px;

    display: flex;
    align-items: center;

    flex-shrink: 0;

  /* Developer contact — small dev-logo avatar + "Live Chat on Telegram" pill,
     reused on the login screen (footer, below the auth card) and inside the
     ⋯ settings dropdown (as a plain link row). */
  .dev-contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
  }
  .dev-contact img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(139,92,246,0.4);
  }
  .dev-contact-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--outline);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .tg-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #29A9EA;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .tg-icon svg { display: block; }
  .dev-contact-logo-sm {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .menu-overlay { position: fixed; inset: 0; z-index: 50; }
  .menu-dropdown {
    position: absolute;
    top: 46px;
    right: 0;
    z-index: 60;
    background: rgba(20,14,34,0.92);
    border: 1px solid var(--outline);
    border-radius: 16px;
    padding: 6px;
    min-width: 230px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 14px 32px rgba(0,0,0,0.45);
  }
  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 10px;
    text-align: left;
    cursor: pointer;
  }
  .menu-item:hover { background: rgba(255,255,255,0.08); }
  .menu-item-meta { color: var(--cream-dim); font-size: 12px; flex-shrink: 0; }

  /* --- Daily Double popup: self-contained, own dd- prefix throughout so
     nothing here can bleed into or be affected by unrelated rules. Uses
     position:fixed rather than relying on .screen for a positioning
     context, same approach as .menu-overlay above. No tap-outside-to-
     dismiss on purpose — Play or Skip are the only two ways out, so a
     day can never get silently marked handled by an accidental tap. --- */
  .dd-modal-backdrop {
    position: fixed; inset: 0; z-index: 55;
    background: rgba(8,5,16,0.72);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 0 22px;
  }
  .dd-card {
    width: 100%; max-width: 380px;
    background: linear-gradient(160deg, rgba(38,24,58,0.96), rgba(20,13,32,0.98));
    border: 1px solid rgba(255,193,99,0.4);
    border-radius: 26px;
    padding: 28px 22px 22px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 40px rgba(255,193,99,0.12);
    animation: ddPopIn 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
  }
  @keyframes ddPopIn {
    0%   { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .dd-ring-outer {
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative; margin: 0 auto 16px;
  }
  .dd-ring-outer::before {
    content: ''; position: absolute; inset: -14px; border-radius: 50%;
    background: radial-gradient(circle, var(--ochre) 0%, transparent 70%);
    opacity: 0.45; filter: blur(2px);
    animation: ddGlowPulse 2s ease-in-out infinite;
  }
  @keyframes ddGlowPulse {
    0%, 100% { opacity: 0.4; transform: scale(0.96); }
    50%      { opacity: 0.7; transform: scale(1.06); }
  }
  .dd-ring-disc {
    width: 100%; height: 100%; border-radius: 50%;
    background: conic-gradient(#FFC163, #FF9F4D);
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
    box-shadow: 0 0 0 5px rgba(255,255,255,0.04), 0 10px 30px rgba(0,0,0,0.35), 0 0 26px rgba(255,193,99,0.5);
  }
  .dd-ring-inner {
    width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%;
    background: #1B1030; display: flex; align-items: center; justify-content: center;
  }
  .dd-ring-num { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 26px; color: var(--cream); }
  .dd-eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ochre); margin-bottom: 6px;
  }
  .dd-headline {
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 24px; margin: 0 0 10px; color: var(--cream);
  }
  .dd-subline { font-size: 14px; color: var(--cream-dim); line-height: 1.55; margin: 0 0 22px; }
  .dd-play-btn {
    width: 100%; padding: 14px 0; border-radius: 16px; border: none;
    font-weight: 700; font-size: 16px; background: var(--ochre); color: #241608;
    margin-bottom: 10px; cursor: pointer;
  }
  .dd-skip-btn {
    width: 100%; padding: 12px 0; border-radius: 16px; border: 1px solid var(--outline);
    font-weight: 600; font-size: 14px; background: rgba(255,255,255,0.06); color: var(--cream);
    cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) {
    .dd-card, .dd-ring-outer::before { animation: none !important; opacity: 1 !important; }
  }

  /* Consistent back-to-hub control, used on every non-active-gameplay screen */
  .back-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--outline);
    background: rgba(255,255,255,0.06);
    color: var(--cream);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .screen-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    width: 100%;
  }
  .screen-header .screen-title {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 24px;
  }
  /* Used on the per-game options screens: header stays pinned top, body centers
     vertically in whatever space is left, now that those screens hold less content. */
  .wrap-centered { flex: 1; display: flex; flex-direction: column; }
  .screen-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .game-icon-badge {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    margin-bottom: 18px;
  }
  .quit-link {
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  /* Hub game-picker tiles */
  .game-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .game-tile {
    background: var(--bg-card);
    border: 1px solid var(--outline);
    border-radius: 20px;
    padding: 14px;
    text-align: left;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    cursor: pointer;
    color: var(--cream);
  }
  .game-tile:disabled { cursor: not-allowed; opacity: 0.4; }
  .game-tile .tile-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    margin-bottom: 2px;
  }
  .game-tile .tile-name { font-weight: 700; font-size: 14px; font-family: 'Inter', sans-serif; }
  .game-tile .tile-meta { font-size: 11px; color: var(--cream-dim); }
  .game-tile.locked { opacity: 0.45; }
  .game-tile .tile-soon {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--label);
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 2px 6px;
  }
  /* Small "this is tappable" hint, used specifically on the Achievements
     group tiles — without it, next to the arrow-carrying Stream banner
     above them, the 4 grid tiles read as static info rather than links. */
  .game-tile .tile-corner-arrow {
    position: absolute;
    bottom: 12px;
    right: 14px;
    font-size: 16px;
    color: var(--cream-dim);
  }

  /* Achievements sits apart from the game grid on purpose - a full-width
     row rather than a tile, so it reads as a progress summary, not a game. */
  /* "Choose a specific mode" sits directly below the Stream hero card,
     above the Achievements/Progress/Level banners — same self-contained
     pattern as those, its own border-color accent (neutral, since it
     isn't tied to one particular game's color the way the tiles behind
     it are). */
  .modes-banner {
    flex-direction: row;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin-top: 4px;
    margin-bottom: 14px;
    padding: 12px 16px;
    border-color: var(--outline);
  }
  .modes-banner .tile-icon-wrap { margin-bottom: 0; flex-shrink: 0; }
  .modes-banner .banner-text { flex: 1; }
  .modes-banner .banner-name { font-weight: 700; font-size: 15px; font-family: 'Inter', sans-serif; }
  .modes-banner .banner-meta { font-size: 12px; color: var(--cream-dim); margin-top: 2px; }
  .modes-banner .banner-arrow { color: var(--cream-dim); font-size: 18px; flex-shrink: 0; }

  /* Stream's achievement group gets top billing on the Achievements
     screen — full-width like the home screen banners, not one of the
     equal-sized tiles below, since Stream is expected to be the most-
     played mode going forward. */
  .stream-achievement-banner {
    flex-direction: row;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 108px;
    margin-bottom: 14px;
    padding: 18px 18px;
    border-color: rgba(255,193,99,0.45);
  }
  .stream-achievement-banner .tile-icon-wrap { width: 52px; height: 52px; font-size: 24px; margin-bottom: 0; flex-shrink: 0; }
  .stream-achievement-banner .banner-text { flex: 1; }
  .stream-achievement-banner .banner-name { font-weight: 700; font-size: 17px; font-family: 'Inter', sans-serif; }
  .stream-achievement-banner .banner-meta { font-size: 13px; color: var(--cream-dim); margin-top: 4px; }
  .stream-achievement-banner .banner-arrow { color: var(--ochre); font-size: 20px; flex-shrink: 0; }

  .achievements-banner {
    flex-direction: row;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin-top: 12px;
    padding: 12px 16px;
    border-color: rgba(255,193,99,0.35);
  }
  .achievements-banner .tile-icon-wrap { margin-bottom: 0; flex-shrink: 0; }
  .achievements-banner .banner-text { flex: 1; }
  .achievements-banner .banner-name { font-weight: 700; font-size: 15px; font-family: 'Inter', sans-serif; }
  .achievements-banner .banner-meta { font-size: 12px; color: var(--cream-dim); margin-top: 2px; }
  .achievements-banner .banner-arrow { color: var(--ochre); font-size: 18px; flex-shrink: 0; }

  /* My Progress sits as a second banner below Achievements — same
     "not a game" framing. Written as its own self-contained block (not
     extending .achievements-banner) to avoid the kind of cross-rule
     cascade surprise documented elsewhere in this file. */
  .progress-banner {
    flex-direction: row;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin-top: 10px;
    padding: 12px 16px;
    border-color: rgba(201,168,255,0.35);
  }
  .progress-banner .tile-icon-wrap { margin-bottom: 0; flex-shrink: 0; }
  .progress-banner .banner-text { flex: 1; }
  .progress-banner .banner-name { font-weight: 700; font-size: 15px; font-family: 'Inter', sans-serif; }
  .progress-banner .banner-meta { font-size: 12px; color: var(--cream-dim); margin-top: 2px; }
  .progress-banner .banner-arrow { color: var(--label); font-size: 18px; flex-shrink: 0; }

  /* Level banner — third in the stack, below Achievements and My Progress.
     Self-contained for the same reason as the two above it. */
  .level-banner { flex-direction: row; align-items: center; gap: 14px; width: 100%; margin-top: 10px; padding: 12px 16px; border-color: rgba(255,193,99,0.45); }
  .level-banner .banner-text { flex: 1; }
  .level-banner .banner-name { font-weight: 700; font-size: 15px; font-family: 'Inter', sans-serif; }
  .level-banner .banner-meta { font-size: 12px; color: var(--cream-dim); margin-top: 5px; display: flex; align-items: center; gap: 8px; }
  .level-banner .banner-arrow { color: var(--ochre); font-size: 18px; flex-shrink: 0; }

  .xp-track { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .xp-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #FFC163, #FF9F4D); }

  /* The level ring — a conic-gradient progress ring standing in for "% of
     the way to next level", with a gold glow tying it to the Achievements
     color language. Level number sits in the cut-out center. */
  .level-ring {
    --pct: 0%;
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: conic-gradient(#FFC163 0% var(--pct), rgba(255,255,255,0.14) var(--pct) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(255,193,99,0.35);
  }
  .level-ring.small { width: 26px; height: 26px; box-shadow: none; }
  .level-ring-inner {
    width: 34px; height: 34px; border-radius: 50%; background: #1B1030;
    display: flex; align-items: center; justify-content: center;
  }
  .level-ring.small .level-ring-inner { width: 20px; height: 20px; }
  .level-ring-num { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; color: var(--cream); }
  .level-ring.small .level-ring-num { font-size: 9px; }

  /* Top-of-home stat strip: streak + a compact level ring, sharing the
     space the plain streak line used to occupy on its own. */
  .stat-strip { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0 18px; }
  .stat-strip .divider { width: 1px; height: 14px; background: var(--outline); }
  .stat-strip .streak-text { font-size: 14px; color: var(--cream-dim); font-variant-numeric: tabular-nums; }
  .stat-strip .level-mini { display: flex; align-items: center; gap: 6px; }
  .stat-strip .level-mini-text { font-size: 13px; font-weight: 700; color: var(--ochre); }

  /* How XP works screen */
  .recap-row { display: flex; align-items: center; gap: 14px; }
  .recap-text .recap-level { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 17px; }
  .recap-text .recap-sub { font-size: 12px; color: var(--cream-dim); margin-top: 3px; }
  .recap-text .xp-track { margin-top: 8px; width: 180px; }
  .section-label { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--label); margin: 18px 0 10px 4px; }
  .rule-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .rule-row:last-child { border-bottom: none; }
  .rule-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .rule-text { flex: 1; }
  .rule-title { font-size: 13px; font-weight: 600; }
  .rule-sub { font-size: 11px; color: var(--cream-dim); margin-top: 1px; }
  .footnote { font-size: 12px; color: var(--cream-dim); line-height: 1.6; text-align: center; padding: 16px 8px 4px; }

  /* My Progress screen */
  .progress-summary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .card.progress-summary-card { padding: 16px 14px; }
  .progress-summary-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--label);
    margin-bottom: 10px;
  }
  .progress-summary-card.conjugate .progress-summary-eyebrow { color: var(--conjugate); }
  .progress-summary-big {
    font-family: 'Sora', sans-serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .progress-summary-big-label {
    font-size: 11px;
    color: var(--cream-dim);
    margin: 4px 0 12px;
  }
  .progress-summary-stat {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--cream-dim);
    padding: 4px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .progress-summary-stat span:last-child { color: var(--cream); font-weight: 600; }

  .progress-section-title {
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .progress-section-sub {
    font-size: 12px;
    color: var(--cream-dim);
    margin-bottom: 14px;
  }

  .progress-bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 90px;
  }
  .progress-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 100%;
    justify-content: flex-end;
  }
  .progress-bar-count { font-size: 11px; font-weight: 700; color: var(--cream-dim); }
  .progress-bar {
    width: 100%;
    border-radius: 6px 6px 3px 3px;
    background: linear-gradient(180deg, var(--label), rgba(201,168,255,0.25));
  }
  .progress-bar.conjugate {
    background: linear-gradient(180deg, var(--conjugate), rgba(52,211,153,0.22));
  }
  .progress-bar-label { font-size: 10px; color: var(--cream-dim); }

  .progress-review-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--outline);
  }
  .progress-review-item:last-child { border-bottom: none; }
  .progress-review-word { font-weight: 600; font-size: 14px; }
  .progress-review-person { color: var(--cream-dim); font-weight: 400; }
  .progress-review-en { color: var(--cream-dim); font-size: 12.5px; margin-top: 2px; }
  .progress-box-tag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(255,77,109,0.16);
    color: var(--terracotta);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .progress-box-tag.mid { background: rgba(255,193,99,0.16); color: var(--ochre); }
  .progress-empty { font-size: 13px; color: var(--cream-dim); padding: 4px 0; }

  /* Memory Match board */
  .memory-stats-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--cream-dim);
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }
  .memory-stats-row span { color: var(--memory); font-weight: 700; }
  .memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .memory-tile {
    aspect-ratio: 1;
    border-radius: 14px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    line-height: 1.15;
    font-weight: 600;
    padding: 4px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    overflow: hidden;
    word-break: break-word;
    cursor: pointer;
  }
  .memory-tile.face-down { font-size: 18px; color: var(--cream-dim); }
  .memory-tile.matched { background: rgba(45,212,191,0.2); border-color: var(--green); color: #B8FFF3; opacity: 0.8; cursor: default; }
  .memory-tile.mismatch { animation: shake 0.4s ease; border-color: var(--red); }
  .memory-tile.tile-flip { animation: cardFlip 0.7s ease; }
  /* The tile whose partner is still flipping: holds neutral, then reacts in sync once the flip finishes */
  .memory-tile.tile-reacting.mismatch { animation: shake 0.4s ease 0.7s, colorMismatch 0.3s ease 0.7s both; }
  .memory-tile.tile-reacting.matched { animation: pop 0.4s ease 0.7s, colorMatched 0.3s ease 0.7s both; }
  /* The tile that is itself flipping: turns, then reacts at the same synced moment as its partner */
  .memory-tile.tile-flip.tile-reacting.mismatch { animation: cardFlip 0.7s ease, shake 0.4s ease 0.7s, colorMismatch 0.3s ease 0.7s both; }
  .memory-tile.tile-flip.tile-reacting.matched { animation: cardFlip 0.7s ease, pop 0.4s ease 0.7s, colorMatched 0.3s ease 0.7s both; }

  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--outline);
    border-top-color: var(--ochre);
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dropzone {
    display: block;
    text-align: center;
    padding: 28px 16px;
    border: 2px dashed var(--outline);
    border-radius: 18px;
    cursor: pointer;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.03);
  }
  .dropzone .icon { font-size: 28px; margin-bottom: 6px; }
  .dropzone .name { font-weight: 600; }
  .dropzone .hint { font-size: 13px; color: var(--cream-dim); margin-top: 4px; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--cream-dim);
    margin-bottom: 16px;
  }

  .msg-error {
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .msg-ok {
    font-size: 14px;
    color: var(--green);
    margin-bottom: 16px;
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--label);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-bottom: 16px;
    display: inline-block;
  }

  button {
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn-primary {
    width: 100%;
    padding: 14px 0;
    border-radius: 16px;
    border: none;
    font-weight: 700;
    font-size: 16px;
    background: var(--ochre);
    color: #241608;
  }
  .btn-primary:disabled {
    cursor: not-allowed;
    background: var(--outline);
    color: var(--cream-dim);
  }
  .btn-secondary {
    padding: 12px 0;
    border-radius: 16px;
    border: 1px solid var(--outline);
    font-weight: 600;
    font-size: 14px;
    background: rgba(255,255,255,0.06);
    color: var(--cream);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .tiles {
    display: grid;
    gap: 4px;
    margin-bottom: 32px;
  }
  .tile { height: 8px; border-radius: 50%; background: var(--outline); }

  .progress-label {
    text-align: center;
    margin-bottom: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--label);
    font-variant-numeric: tabular-nums;
  }

  .prompt-card {
    background: var(--bg-card);
    border-radius: 24px;
    padding: 40px 24px;
    text-align: center;
    border: 1px solid var(--outline);
    margin-bottom: 20px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    position: relative;
  }
  .card-flip-in { animation: cardFlip 0.5s ease; }
  @keyframes cardFlip {
    from { transform: rotateY(-90deg); opacity: 0; }
    to { transform: rotateY(0deg); opacity: 1; }
  }
  .prompt-card.flash-correct { box-shadow: 0 0 0 3px var(--green) inset; }
  .prompt-card.flash-wrong { box-shadow: 0 0 0 3px var(--red) inset; }

  /* Signature element: a glowing orb, like a bead of sea-glass, showing round progress */
  .glow-orb-progress {
    position: absolute;
    top: -16px;
    right: -14px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E8FFFB, #2DD4BF 55%, #0E7C6D 100%);
    box-shadow: 0 0 24px rgba(45,212,191,0.65);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #082620;
  }
  .glow-orb-progress .orb-num { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .glow-orb-progress .orb-lbl { font-size: 7px; letter-spacing: 1px; font-weight: 600; }

  .ta-header { margin-bottom: 24px; }
  .ta-timer-track {
    height: 8px;
    background: var(--outline);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .ta-timer-fill {
    height: 100%;
    background: var(--ochre);
    border-radius: 4px;
    transition: width 0.25s linear;
  }
  .ta-stats-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.5px;
    color: var(--cream-dim);
    font-variant-numeric: tabular-nums;
  }
  .ta-score-label span, .ta-timer-label { color: var(--ochre); font-weight: 700; }
  .prompt-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .prompt-word {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 34px;
  }
  .prompt-translation {
    font-size: 14px;
    color: var(--cream-dim);
    margin-top: 6px;
    font-style: italic;
  }
  /* A word's disambiguating Note, shown under the prompt word only when
     that word IS the note-bearing English text (see renderQuiz/
     renderTimeAttack) - deliberately styled the same as .prompt-translation
     but a separate class so the two can be tuned independently later. */
  .prompt-note {
    font-size: 14px;
    color: var(--cream-dim);
    margin-top: 6px;
    font-style: italic;
  }
  /* Cloze/fill-in-the-blank: the sentence reads as normal body text with
     the missing word rendered as a distinct blank, rather than the huge
     .prompt-word treatment - it's a sentence to read, not a single word
     to react to. */
  .cloze-sentence {
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1.5;
  }
  .cloze-blank {
    display: inline-block;
    min-width: 60px;
    border-bottom: 2px solid var(--ochre);
    color: var(--ochre);
  }
  .speak-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--outline);
    color: var(--cream);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .speak-btn.speaking {
    border-color: var(--label);
    color: var(--label);
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,255,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(201,168,255,0); }
  }
  .speak-btn.big {
    width: 78px;
    height: 78px;
    font-size: 30px;
    margin: 6px auto 4px;
    background: rgba(201,168,255,0.14);
    border-color: var(--label);
  }
  /* Cloze "hint" button - hears the full sentence (target word included),
     unlike .speak-btn on a cloze question which deliberately only reads the
     surrounding context. Same round-button family as .speak-btn, just wide
     enough for a short text label instead of a single emoji glyph. */
  .hint-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--outline);
    color: var(--cream);
    width: 46px;
    height: 34px;
    border-radius: 17px;
    font-family: 'Sora', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hint-btn.speaking {
    border-color: var(--label);
    color: var(--label);
    animation: pulse 0.9s ease-in-out infinite;
  }
  .audio-hint { font-size: 12px; color: var(--cream-dim); text-align: center; }
  .glow-orb-progress.streak-orb {
    background: radial-gradient(circle at 35% 30%, #FFF3DD, #FFC163 55%, #B97C1A 100%);
    box-shadow: 0 0 24px rgba(255,193,99,0.65);
    color: #3A2508;
  }

  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream);
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
    font-family: 'Inter', sans-serif;
  }
  input[type="email"]:focus, input[type="password"]:focus, input[type="text"]:focus {
    border-color: var(--ochre);
  }

  .option-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .option-btn {
    width: 100%;
    padding: 16px 18px;
    border-radius: 16px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream);
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .option-btn:hover:not(:disabled) { border-color: var(--label); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct-choice { background: rgba(45,212,191,0.22); border-color: var(--green); color: #B8FFF3; }
  .option-btn.wrong-choice { background: rgba(255,77,109,0.22); border-color: var(--red); }
  .option-btn.pop-anim { animation: pop 0.4s ease; }
  .option-btn.shake-anim { animation: shake 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes colorMismatch {
    from { border-color: var(--outline); }
    to { border-color: var(--red); }
  }
  @keyframes colorMatched {
    from { background: var(--bg-card-alt); border-color: var(--outline); color: var(--cream); }
    to { background: rgba(45,212,191,0.2); border-color: var(--green); color: #B8FFF3; }
  }

  .countdown-bar-track {
    height: 4px;
    background: var(--outline);
    border-radius: 2px;
    overflow: hidden;
    margin: 10px 0 4px;
  }
  .countdown-bar-fill {
    height: 100%;
    width: 100%;
    background: var(--ochre);
    border-radius: 2px;
    transition: width 3s linear;
  }

  .feedback {
    padding: 16px 18px;
    border-radius: 16px;
    margin-bottom: 12px;
    animation: pop 0.3s ease;
  }
  .feedback.correct {
    background: rgba(45,212,191,0.14);
    border: 1px solid var(--green);
  }
  .feedback.wrong {
    background: rgba(255,77,109,0.14);
    border: 1px solid var(--red);
    animation: shake 0.4s ease;
  }
  .feedback .title { font-weight: 700; }
  .feedback .answer { font-size: 14px; color: var(--cream-dim); margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .feedback .answer strong { color: var(--cream); }

  .score-big {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .new-best {
    text-align: center;
    color: var(--ochre);
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .streak-line {
    text-align: center;
    font-size: 14px;
    color: var(--cream-dim);
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }

  .mosaic {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-bottom: 28px;
  }
  .mosaic .sq { aspect-ratio: 1; border-radius: 50%; }

  .review-title { font-weight: 700; margin-bottom: 12px; }
  .review-item {
    font-size: 14px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--outline);
  }
  .review-item:last-child { border-bottom: none; margin-bottom: 0; }
  .review-item .from { color: var(--cream-dim); }
  .review-item .to { color: var(--cream); font-weight: 600; }
  .review-item .yours { color: var(--terracotta); font-size: 13px; margin-top: 2px; }

    const allIds = Object.keys(ACHIEVEMENTS);
    if (group.prefix === null) {
      const otherPrefixes = ACHIEVEMENT_GROUPS.filter(g => g.prefix).map(g => g.prefix);
      return allIds.filter(id => !otherPrefixes.some(p => id.startsWith(p)));
    }
    return allIds.filter(id => id.startsWith(group.prefix));
  }

  // --- XP & Level ---------------------------------------------------------
  // XP and Level are purely derived from existing lifetime counters at
  // render time — nothing new is stored for them, so there's no shape-merge
  // work needed and nothing that can drift out of sync between devices.
  // Every ingredient below is a monotonic lifetime counter or a best-ever
  // record, never a value that can drop — so XP (and therefore Level) only
  // ever goes up.
  const XP_LEVEL_BASE_SPAN = 100;    // XP needed to clear Level 1
  const XP_LEVEL_GROWTH = 1.15;      // each level needs 15% more than the last
  const XP_PER_QUIZ_CORRECT = 1;
  const XP_PER_CONJUGATE_CORRECT = 1;
  const XP_PER_TIMEATTACK_CORRECT = 0.5; // faster-paced mode, so a lower per-answer rate keeps XP/minute roughly even with Quiz
  const XP_MEMORY_BOARD = { '6': 10, '8': 15, '12': 25 }; // bigger board, bigger reward
  const XP_MEMORY_LEGACY = 15; // flat fallback for boards cleared before per-size tracking existed
  const XP_PER_BEST_STREAK_POINT = 2;
  const XP_PER_ACHIEVEMENT = 20;

  function computeXP(progress) {
    let xp = 0;
    xp += progress.lifetime.totalCorrect * XP_PER_QUIZ_CORRECT;
    xp += progress.conjugateLifetime.totalCorrect * XP_PER_CONJUGATE_CORRECT;
    xp += progress.taLifetime.totalCorrect * XP_PER_TIMEATTACK_CORRECT;

    const bySize = (progress.memoryLifetime && progress.memoryLifetime.bySize) || {};
    let trackedBoards = 0;
    Object.keys(XP_MEMORY_BOARD).forEach(size => {
      const count = bySize[size] || 0;
      trackedBoards += count;
      xp += count * XP_MEMORY_BOARD[size];
    });
    // Boards cleared before per-size tracking existed still count, just at
    // a flat rate since we don't know what size they were.
    const totalBoards = (progress.memoryLifetime && progress.memoryLifetime.boardsCleared) || 0;
    const legacyBoards = Math.max(0, totalBoards - trackedBoards);
    xp += legacyBoards * XP_MEMORY_LEGACY;

    xp += progress.streak.best * XP_PER_BEST_STREAK_POINT;
    xp += progress.conjugateStreak.best * XP_PER_BEST_STREAK_POINT;

    const achievementsUnlocked = Object.values(progress.achievements || {}).filter(a => a && a.unlocked).length;
    xp += achievementsUnlocked * XP_PER_ACHIEVEMENT;

    xp += progress.dailyDoubleBonusXP || 0;

    return Math.round(xp);
  }

  // Walks the compounding-XP curve to find the current level and progress
  // toward the next one. Cheap even at very high XP totals since it stops
  // the moment the cumulative threshold passes the current amount.
  function getXPLevel(progress) {
    const xp = computeXP(progress);
    let span = XP_LEVEL_BASE_SPAN;
    let cumulative = 0;
    let level = 1;
    while (cumulative + span <= xp) {
      cumulative += span;
      level += 1;
      span = Math.round(span * XP_LEVEL_GROWTH);
    }
    const xpIntoLevel = xp - cumulative;
    const pct = Math.max(0, Math.min(100, Math.round((xpIntoLevel / span) * 100)));
    return { xp, level, xpIntoLevel, xpForNextLevel: span, pct };
  }

  // file id (matches "categories-{id}.xlsx" in the repo) -> display name + icon
  // kept in alphabetical order by name, which is also the order the tiles render in
  const CATEGORIES = [
    { id: 'animals',        name: 'Animals',          icon: '🐾' },
    { id: 'bodyparts',      name: 'Body Parts',       icon: '🖐️' },
    { id: 'clothing',       name: 'Clothing',         icon: '👕' },

    { id: 'emotions',       name: 'Emotions',         icon: '😊' },
    { id: 'family',         name: 'Family',           icon: '👪' },
    { id: 'foodanddrink',   name: 'Food and Drink',   icon: '🍽️' },
    { id: 'greetings',      name: 'Greetings',        icon: '👋' },

    { id: 'numbers',        name: 'Numbers',          icon: '🔢' },

    { id: 'weather',        name: 'Weather',          icon: '🌦️' },
  ];

  function normalizeWordStats(wordStats) {
    // One-time migration: some words used to carry a disambiguator baked
    // into the English cell, e.g. "to be (essential)" - that text now
    // lives in a separate Note column, so the English cell (and therefore
    // this word's key) is clean. Rename any stored key still using the old
    // parenthetical form so existing box/streak progress carries over
    // rather than looking reset. Harmless no-op for verbStats, whose keys
    // are `es::personIndex` and never contain parentheses.
    Object.keys(wordStats).forEach(oldKey => {
      const sep = oldKey.indexOf('::');
      if (sep === -1) return;
      const esPart = oldKey.slice(0, sep);
      const enPart = oldKey.slice(sep + 2);
      const strippedEn = enPart.replace(/\s*\([^)]*\)\s*$/, '').trim();
      if (!strippedEn || strippedEn === enPart) return;
      const newKey = esPart + '::' + strippedEn;
      if (newKey === oldKey || wordStats[newKey]) return;
      wordStats[newKey] = wordStats[oldKey];
      delete wordStats[oldKey];
    });

    Object.keys(wordStats).forEach(key => {
      const ws = wordStats[key];
      if (typeof ws.box !== 'number') {
        const right = ws.right || 0;
        const wrong = ws.wrong || 0;
        ws.box = wrong > 0 ? 0 : Math.min(right, SRS_INTERVALS_DAYS.length - 1);
        ws.nextDue = 0;
        ws.lastSeen = ws.lastSeen || 0;
      }
    });
    return wordStats;
  }

  // --- Auth ---------------------------------------------------------

  let cloudSyncTimer = null;

  function initAuth() {
    function onReady() {
      // Picks up the result of a Google sign-in redirect, if this load is
      // the browser returning from one. No-op otherwise.
      window.PalabraAuth.getRedirectResult().catch((err) => {
        state.authError = friendlyAuthError(err);
        state.authBusy = false;
        render();
      });

      window.PalabraAuth.onAuthStateChanged(async (user) => {
        state.user = user;
        state.authBusy = false;

        if (user) {
          await pullCloudProgress(user.uid);
          pingActivity();
          if (state.screen === 'login') state.screen = 'start';
        }
        render();
      });
    }

    if (window.PalabraAuth) onReady();
    else window.addEventListener('palabra-firebase-ready', onReady, { once: true });
  }

  // Distinguishes the Android APK (Trusted Web Activity) from an installed
  // home-screen PWA from a plain browser tab — the three real channels
  // people actually use this through.
  function detectPlatform() {
    try {
      if (document.referrer && document.referrer.startsWith('android-app://')) return 'android-apk';
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return 'installed-pwa';
      return 'browser';
    } catch (e) {
      return 'unknown';
    }
  }

  // Lightweight "still actually playing" signal, kept separate from the
  // full progress doc (and its own updatedAt) so it isn't affected by
  // whether progress happened to change. Throttled per session so this
  // never fires more than once every couple of minutes, regardless of how
  // often it's called.
  let lastActivityPingMs = 0;
  const ACTIVITY_PING_MIN_INTERVAL_MS = 2 * 60 * 1000;
  function pingActivity() {
    if (!state.user) return;
    const now = Date.now();
    if (now - lastActivityPingMs < ACTIVITY_PING_MIN_INTERVAL_MS) return;
    lastActivityPingMs = now;
    try {
      window.PalabraAuth.setUserDoc(state.user.uid, {
        lastActiveAt: window.PalabraAuth.serverTimestamp(),
        lastActiveAtMs: now,
        platform: detectPlatform()
      }).catch(() => {});
    } catch (e) { /* ignore — this is best-effort only */ }
  }

  // Fire-and-forget ping straight to the Telegram Bot API on a genuinely
  // new account. Never awaited and never surfaces an error — a failed or
  // disabled notification must never get in the way of someone actually
  // signing up.
  function notifyNewSignup(email, method) {
    if (!TELEGRAM_CHAT_ID) return;
    try {
      fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: `🎉 New Palabra signup\n${email || '(no email)'}\nvia ${method || 'email'}`
        })
      }).catch(() => {});
    } catch (e) { /* ignore — notification is best-effort only */ }
  }

  function friendlyAuthError(err) {
    const code = err && err.code;
    if (code === 'palabra/timeout') return "That's taking too long to respond. Check your connection and try again — if you're testing this file locally (a file:/// address) rather than through the live site or localhost, that will also cause this.";
    if (code === 'auth/email-already-in-use') return 'That email already has an account — try signing in instead.';
    if (code === 'auth/invalid-email') return "That doesn't look like a valid email address.";
    if (code === 'auth/weak-password') return 'Password should be at least 6 characters.';
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return "We couldn't sign you in with that email and password. Double-check for typos, or tap \"Create account\" if you're new here.";
    if (code === 'auth/user-not-found') return 'No account found for that email — try creating one instead.';
    if (code === 'auth/too-many-requests') return 'Too many attempts — wait a moment and try again.';
    return "Something went wrong. Check your details and try again.";
  }

  // Wraps a Firebase call so a stuck network request fails after AUTH_TIMEOUT_MS
  // instead of leaving the "Please wait…" button stuck forever.
  const AUTH_TIMEOUT_MS = 15000;
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject({ code: 'palabra/timeout' }), ms))
    ]);
  }

  async function handleAuthSubmit() {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const isSignup = state.authMode === 'signup';
    // Captured now, before the render() below regenerates the form (and
    // with it, a brand new empty username input) — reading it later from
    // the DOM would read back nothing, which is exactly what was happening.
    const username = isSignup ? document.getElementById('auth-username').value.trim() : '';

    if (!email || !password) {
      state.authError = 'Enter an email and password to continue.';
      render();
      return;
    }
    if (isSignup) {
      const confirm = document.getElementById('auth-confirm').value;
      if (password !== confirm) {
        state.authError = "Passwords don't match.";
        render();
        return;
      }
    }

    state.authBusy = true;
    state.authError = '';
    state.authInfo = '';
    render();

    try {
      if (isSignup) {
        // Every new account starts from a completely clean slate. Never
        // carry forward whatever's currently in memory/localStorage — it
        // may well belong to a different account previously used on this
        // device, not this brand new one.
        state.progress = defaultProgress();
        // Give a brand new account a grace day before the Daily Double
        // popup can ever appear — someone who just signed up hasn't seen
        // a normal round yet, let alone Level/XP, so "Power up your
        // learning" would be meaningless on the very first screen they see.
        state.progress.dailyDoubleLastHandled = todayDateString();
        state.lastSyncedMs = 0;
        const cred = await withTimeout(window.PalabraAuth.signUp(email, password), AUTH_TIMEOUT_MS);
        const signupMs = Date.now();
        await withTimeout(window.PalabraAuth.setUserDoc(cred.user.uid, {
          username: username || null,
          email,
          progress: state.progress,
          createdAtMs: signupMs,
          createdAt: window.PalabraAuth.serverTimestamp(),
          updatedAtMs: signupMs,
          updatedAt: window.PalabraAuth.serverTimestamp(),
          platform: detectPlatform()
        }), AUTH_TIMEOUT_MS);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); } catch (e) {}
        state.username = username;
        state.lastSyncedMs = signupMs;
        notifyNewSignup(email, 'email');
        // Explicit render so the menu reflects the username immediately —
        // don't rely solely on onAuthStateChanged's own render(), since its
        // timing relative to this point isn't guaranteed.
        render();
      } else {
        await withTimeout(window.PalabraAuth.signIn(email, password), AUTH_TIMEOUT_MS);
      }
      // onAuthStateChanged (in initAuth) takes it from here for sign-in.
    } catch (err) {
      state.authBusy = false;
      state.authError = friendlyAuthError(err);
      render();
    }
  }

  async function handleForgotPassword() {
    const email = document.getElementById('auth-email').value.trim();
    if (!email) {
      state.authError = 'Enter your email above first, then tap "Forgot password?"';
      state.authInfo = '';
      render();
      return;
    }
    state.authBusy = true;
    state.authError = '';
    state.authInfo = '';
    render();
    try {
      await withTimeout(window.PalabraAuth.resetPassword(email), AUTH_TIMEOUT_MS);
      state.authBusy = false;
      state.authInfo = `Password reset email sent to ${email} — check your inbox.`;
      render();
    } catch (err) {
      state.authBusy = false;
      state.authError = friendlyAuthError(err);
      render();
    }
  }

  function handleGoogleSignIn() {
    state.authBusy = true;
    state.authError = '';
    state.authInfo = '';
    render();
    withTimeout(window.PalabraAuth.signInWithGoogle(), AUTH_TIMEOUT_MS).catch((err) => {
      state.authBusy = false;
      state.authError = friendlyAuthError(err);
      render();
    });
    // On success the page navigates away and back; getRedirectResult()
    // in initAuth() picks up the outcome on reload.
  }

  // --- Cloud progress sync -------------------------------------------

  // Same defensive shape-merge as loadProgress()/importProgress() below,
  // applied to whatever's stored in Firestore so a malformed or
  // partial cloud doc can't corrupt local state.
  function mergeProgressShape(parsed) {
    const merged = defaultProgress();
    merged.wordStats = normalizeWordStats(parsed.wordStats || {});
    merged.verbStats = normalizeWordStats(parsed.verbStats || {});
    merged.streak = Object.assign(merged.streak, parsed.streak || {});
    merged.conjugateStreak = Object.assign(merged.conjugateStreak, parsed.conjugateStreak || {});
    merged.lifetime = Object.assign(merged.lifetime, parsed.lifetime || {});
    merged.conjugateLifetime = Object.assign(merged.conjugateLifetime, parsed.conjugateLifetime || {});
    merged.timeAttackBest = typeof parsed.timeAttackBest === 'number' ? parsed.timeAttackBest : 0;
    merged.masteredWordsCount = typeof parsed.masteredWordsCount === 'number' ? parsed.masteredWordsCount : 0;
    merged.taLifetime = Object.assign(merged.taLifetime, parsed.taLifetime || {});
    merged.memoryBest = Object.assign({}, parsed.memoryBest || {});
    merged.memoryLifetime = Object.assign(merged.memoryLifetime, parsed.memoryLifetime || {});
    merged.streamLifetime = Object.assign(merged.streamLifetime, parsed.streamLifetime || {});
    merged.memoryClearedSizes = Object.assign({}, parsed.memoryClearedSizes || {});
    merged.settings = Object.assign(merged.settings, parsed.settings || {});
    merged.achievements = Object.assign({}, parsed.achievements || {});
    merged.dailyDoubleLastHandled = typeof parsed.dailyDoubleLastHandled === 'string' ? parsed.dailyDoubleLastHandled : null;
    merged.dailyDoubleBonusXP = typeof parsed.dailyDoubleBonusXP === 'number' ? parsed.dailyDoubleBonusXP : 0;
    return merged;
  }

  async function pullCloudProgress(uid) {
    try {
      const snap = await window.PalabraAuth.getUserDoc(uid);
      if (snap.exists() && snap.data().progress) {
        const data = snap.data();
        const remoteMs = data.updatedAtMs || 0;
        if (remoteMs < state.lastSyncedMs) {
          // This device has already pushed something newer than this
          // snapshot — skip it so older cloud data can't clobber more
          // recent local progress (e.g. a push from this device still
          // landing, or a slow read racing a faster write elsewhere).
          return;
        }
        state.progress = mergeProgressShape(data.progress);
        state.username = data.username || '';
        state.lastSyncedMs = remoteMs;
        state.progressDirty = false;
        // Resync the level baseline silently — this data may reflect a
        // level reached on a different device, and shouldn't replay a
        // celebration here for a milestone this device didn't just earn.
        state.lastKnownLevel = getXPLevel(state.progress).level;
        // Write straight to localStorage rather than via saveProgress(),
        // which would also schedule another cloud push — a pull should
        // never trigger a push right back, or two open tabs can end up
        // volleying stale writes at each other.
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); } catch (e) {}
      } else {
        // Signed-in user with no cloud doc yet — this is a genuinely new
        // account (email/password signups already write a doc in
        // handleAuthSubmit before this ever runs, so in practice this only
        // fires for a first-time Google sign-in, or the rare edge case
        // that comment above already described). Same rule as email
        // signup: never carry forward whatever's currently local — it may
        // belong to a different account previously used on this device.
        state.progress = defaultProgress();
        state.progress.dailyDoubleLastHandled = todayDateString(); // same grace-day rule as email signup
        const ms = Date.now();
        await window.PalabraAuth.setUserDoc(uid, {
          progress: state.progress,
          createdAtMs: ms,
          createdAt: window.PalabraAuth.serverTimestamp(),
          updatedAtMs: ms,
          updatedAt: window.PalabraAuth.serverTimestamp(),
          platform: detectPlatform()
        });
        state.lastSyncedMs = ms;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); } catch (e) {}
        const provider = (state.user && state.user.providerData && state.user.providerData[0] && state.user.providerData[0].providerId === 'google.com') ? 'google' : 'email';
        notifyNewSignup(state.user && state.user.email, provider);
      }
    } catch (err) {
      // Offline or blocked — fall back silently to local progress.
    }
  }

  // Debounced so a run of quick answers doesn't fire a Firestore write per
  // answer — resets on every call, actually writes once things go quiet.
  function doCloudPush() {
    if (!state.user) return Promise.resolve();
    const ms = Date.now();
    return window.PalabraAuth.setUserDoc(state.user.uid, {
      progress: state.progress,
      username: state.username || null,
      updatedAtMs: ms,
      updatedAt: window.PalabraAuth.serverTimestamp()
    }).then(() => {
      state.lastSyncedMs = ms;
      state.progressDirty = false;
    }).catch(() => {
      // Offline or blocked — local progress is still safe and will
      // retry next time saveProgress() runs.
    });
  }

  function pushCloudProgressDebounced() {
    if (!state.user) return;
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(doCloudPush, 2500);
  }

  // Pushes any not-yet-synced local change immediately (skipping the
  // debounce wait), used before pulling fresh cloud data so a genuine
  // unsaved local change can't get clobbered by an older cloud copy. If
  // nothing has actually changed locally since the last sync, this is a
  // no-op — pushing a stale-but-unchanged copy just to "flush" would stamp
  // it with a fresh timestamp and let it wrongly win over genuinely newer
  // data from another device, which is exactly the bug this exists to avoid.
  function flushCloudSync() {
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = null;
    if (!state.progressDirty) return Promise.resolve();
    return doCloudPush();
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultProgress();
      const parsed = JSON.parse(raw);
      const merged = defaultProgress();
      merged.wordStats = normalizeWordStats(parsed.wordStats || {});
      merged.verbStats = normalizeWordStats(parsed.verbStats || {});
      merged.streak = Object.assign(merged.streak, parsed.streak || {});
      merged.conjugateStreak = Object.assign(merged.conjugateStreak, parsed.conjugateStreak || {});
      merged.lifetime = Object.assign(merged.lifetime, parsed.lifetime || {});
      merged.conjugateLifetime = Object.assign(merged.conjugateLifetime, parsed.conjugateLifetime || {});
      merged.timeAttackBest = typeof parsed.timeAttackBest === 'number' ? parsed.timeAttackBest : 0;
      merged.masteredWordsCount = typeof parsed.masteredWordsCount === 'number' ? parsed.masteredWordsCount : 0;
      merged.taLifetime = Object.assign(merged.taLifetime, parsed.taLifetime || {});
      merged.memoryBest = Object.assign({}, parsed.memoryBest || {});
      merged.memoryLifetime = Object.assign(merged.memoryLifetime, parsed.memoryLifetime || {});
      merged.streamLifetime = Object.assign(merged.streamLifetime, parsed.streamLifetime || {});
      merged.memoryClearedSizes = Object.assign({}, parsed.memoryClearedSizes || {});
      merged.settings = Object.assign(merged.settings, parsed.settings || {});
      merged.achievements = Object.assign({}, parsed.achievements || {});
      merged.dailyDoubleLastHandled = typeof parsed.dailyDoubleLastHandled === 'string' ? parsed.dailyDoubleLastHandled : null;
      merged.dailyDoubleBonusXP = typeof parsed.dailyDoubleBonusXP === 'number' ? parsed.dailyDoubleBonusXP : 0;
      return merged;
    } catch (e) {
      return defaultProgress();
    }
  }

  // Detects a level-up the instant it happens, from wherever it happens —
  // saveProgress() is already called after every stat-changing action
  // across all four games, so this one hook covers everything without
  // touching each game engine individually. Doesn't show anything itself;
  // just flags it, so the actual celebration can wait for a safe moment
  // (see leaveResults() below) rather than interrupting live play.
  function checkLevelUp() {
    const level = getXPLevel(state.progress).level;
    if (state.lastKnownLevel === null) {
      // First check this session — establish the baseline, don't celebrate
      // whatever level the account already happened to be at.
      state.lastKnownLevel = level;
      return;
    }
    if (level > state.lastKnownLevel) {
      state.pendingLevelUp = level;
      state.lastKnownLevel = level;
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    } catch (e) {
      // storage unavailable (private browsing etc.) - fail silently
    }
    state.progressDirty = true;
    pushCloudProgressDebounced();
    checkLevelUp();
  }

  function exportProgress() {
    const blob = new Blob([JSON.stringify(state.progress, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'palabra-progress.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importProgress(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        const merged = defaultProgress();
        merged.wordStats = normalizeWordStats(parsed.wordStats || {});
        merged.verbStats = normalizeWordStats(parsed.verbStats || {});
        merged.streak = Object.assign(merged.streak, parsed.streak || {});
        merged.conjugateStreak = Object.assign(merged.conjugateStreak, parsed.conjugateStreak || {});
        merged.lifetime = Object.assign(merged.lifetime, parsed.lifetime || {});
        merged.conjugateLifetime = Object.assign(merged.conjugateLifetime, parsed.conjugateLifetime || {});
        merged.timeAttackBest = typeof parsed.timeAttackBest === 'number' ? parsed.timeAttackBest : 0;
        merged.masteredWordsCount = typeof parsed.masteredWordsCount === 'number' ? parsed.masteredWordsCount : 0;
        merged.taLifetime = Object.assign(merged.taLifetime, parsed.taLifetime || {});
        merged.memoryBest = Object.assign({}, parsed.memoryBest || {});
        merged.memoryLifetime = Object.assign(merged.memoryLifetime, parsed.memoryLifetime || {});
        merged.streamLifetime = Object.assign(merged.streamLifetime, parsed.streamLifetime || {});
        merged.memoryClearedSizes = Object.assign({}, parsed.memoryClearedSizes || {});
        merged.settings = Object.assign(merged.settings, parsed.settings || {});
        merged.achievements = Object.assign({}, parsed.achievements || {});
        merged.dailyDoubleLastHandled = typeof parsed.dailyDoubleLastHandled === 'string' ? parsed.dailyDoubleLastHandled : null;
        merged.dailyDoubleBonusXP = typeof parsed.dailyDoubleBonusXP === 'number' ? parsed.dailyDoubleBonusXP : 0;
        state.progress = merged;
        saveProgress();
        render();
      } catch (e) {
        alert("That file doesn't look like a valid progress export.");
      }
    };
    reader.readAsText(file);
  }

  const state = {
    screen: 'login', // login | start | quiz | result
    user: null,
    username: '',
    editingUsername: false,
    needsCloudSync: false,
    lastSyncedMs: 0,
    progressDirty: false,
    authMode: 'signin', // signin | signup
    authError: '',

    questions: [],

    checked: false,

    effectiveAnswerMode: 'type',

    celebrateVariant: null, // 'perfect' | 'finished'

    verbsError: '',

    conjugateWasCorrect: false,
