  function renderMemoryPlay() {
    const app = document.getElementById('app');

    const tilesHtml = state.memoryTiles.map((tile, i) => {
      const isFlipped = state.memoryFlipped.includes(i) || tile.matched;
      let cls = 'memory-tile';
      if (!isFlipped) cls += ' face-down';
      if (tile.matched) cls += ' matched';
      if (state.memoryFlipped.length === 2 && !tile.matched && state.memoryFlipped.includes(i)) {
        const [a, b] = state.memoryFlipped;
        const ta = state.memoryTiles[a], tb = state.memoryTiles[b];
        if (ta.pairIndex !== tb.pairIndex) cls += ' mismatch';
      }
      if (state.memoryJustFlipped.includes(i)) cls += ' tile-flip';
      if (state.memoryReacting.includes(i)) cls += ' tile-reacting';
      const content = isFlipped ? esc(tile.text) : '❔';
      return `<button class="${cls}" data-idx="${i}" ${tile.matched ? 'disabled' : ''}>${content}</button>`;
    }).join('');

    app.innerHTML = `

        <div class="wrap">
          <div class="memory-stats-row">

          <div class="memory-grid">${tilesHtml}</div>
          <button id="memory-quit-btn" class="quit-link" style="display:block; text-align:center; width:100%;">Quit</button>
        </div>
      </div>
    `;

    document.querySelectorAll('.memory-tile').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        flipMemoryTile(idx);
      });
    });

    document.getElementById('memory-quit-btn').addEventListener('click', quitMemoryMatch);
  }

  function renderMemoryResult() {
    const app = document.getElementById('app');
    const best = state.progress.memoryBest[state.progress.settings.memoryGridSize];

    app.innerHTML = `
      <div class="screen bg-memory">
        <div class="wrap wrap-centered">
          <div class="screen-header">
            <button id="back-btn" class="back-btn">←</button>
          </div>
          <div class="screen-body">
            <div class="eyebrow" style="margin-bottom:4px;">Completado</div>
            <div class="score-big" style="margin-bottom:8px;">${state.memoryMoves}</div>
            <div class="streak-line">moves · ${formatMemoryTime(state.memorySeconds)}</div>
            ${state.memoryIsNewBest ? `<div class="new-best">🏆 New best!</div>` : (best ? `<div class="streak-line">Best: ${best} moves</div>` : '')}
            <button id="again-btn" class="btn-primary" style="width:100%; margin-bottom:10px; margin-top:8px;">Play again</button>
            <button id="settings-btn" class="btn-secondary" style="width:100%;">Change settings</button>
          </div>

    document.getElementById('back-btn').addEventListener('click', () => leaveResults(goHome));
    document.getElementById('again-btn').addEventListener('click', () => leaveResults(startMemoryMatch));
    document.getElementById('settings-btn').addEventListener('click', () => leaveResults(backToMemorySetup));
  }

  function renderQuiz() {
    const app = document.getElementById('app');
    const current = state.questions[state.index];
    if (!current) return;

    const isAudioFormat = state.isStreamRound && current.format === 'audio';

    let tilesHtml = '';
    if (state.isStreamRound) {
      // Shows progress within the current 10-question checkpoint block,
      // not the whole (continuously-extended) questions array.
      const recentResults = state.results.slice(state.results.length - state.streamCheckpointCount);
      for (let i = 0; i < STREAM_CHECKPOINT_SIZE; i++) {
        let bg = 'var(--outline)';
        if (i < recentResults.length) bg = recentResults[i].correct ? COLORS.green : COLORS.red;
        else if (i === recentResults.length) bg = COLORS.ochre;
        tilesHtml += `<div class="tile" style="background:${bg}"></div>`;
      }
    } else {
      state.questions.forEach((_, i) => {
        let bg = 'var(--outline)';
        if (i < state.results.length) bg = state.results[i].correct ? COLORS.green : COLORS.red;
        else if (i === state.index) bg = COLORS.ochre;
        tilesHtml += `<div class="tile" style="background:${bg}"></div>`;
      });
    }

    const clozeBlank = current.format === 'cloze' ? findClozeBlank(current) : null;
    const clozeFallback = current.format === 'cloze' && !clozeBlank;
    // Read the context aloud, not the answer — the whole point of cloze is
    // guessing the missing word, so speaking current.sentence verbatim
    // (which still contains it) would just hand it over. "..." gives
    // TTS engines a natural pause where the word would go.
    const promptWord = (current.format === 'cloze' && clozeBlank) ? `${clozeBlank.before} ... ${clozeBlank.after}`.replace(/\s+/g, ' ').trim()
      : clozeFallback ? primaryText(current.en)
      : primaryText(current.direction === 'es-en' ? current.es : current.en);
    const answerWord = current.format === 'cloze' ? primaryText(current.es) : primaryText(current.direction === 'es-en' ? current.en : current.es);
    const promptLang = (current.format === 'cloze' && clozeBlank) ? 'es-ES'
      : clozeFallback ? 'en-US'
      : (current.direction === 'es-en' ? 'es-ES' : 'en-US');
    const answerLang = current.format === 'cloze' ? 'es-ES' : (current.direction === 'es-en' ? 'en-US' : 'es-ES');
    // The Note column disambiguates the English gloss specifically - only
    // relevant wherever English text is what's being shown, whether that's
    // the prompt (EN→ES) or the reveal (ES→EN, wrong or typo-forgiven).
    // Cloze never shows it - the prompt is a Spanish sentence, not a gloss.
    const promptNote = (current.format !== 'cloze' && current.direction !== 'es-en') ? (current.note || '') : '';
    const answerNote = (current.format !== 'cloze' && current.direction === 'es-en') ? (current.note || '') : '';

    // Stream decides choice-vs-type per question; every other mode still
    // uses the single round-level answerMode setting. Cloze is always
    // typed - a word bank would just hand back the ambiguity problem the
    // format exists to avoid (see the sentence-writing discussion).
    const useChoice = state.isStreamRound
      ? (current.format !== 'type' && current.format !== 'cloze' && state.currentOptions)
      : (state.effectiveAnswerMode === 'choice' && state.currentOptions);
    const shouldFlip = state.lastFlippedIndex !== state.index;
    if (shouldFlip) state.lastFlippedIndex = state.index;

    // results.length already counts the just-answered question once
    // checked is true (recordAnswer pushed it before this render), so the
    // +1 only belongs while the question is still unanswered — otherwise
    // the feedback screen for question 10 briefly claims to be question 11.
    const streamQuestionNum = state.results.length + (state.checked ? 0 : 1);
    const progressLabel = state.isStreamRound
      ? `Question ${streamQuestionNum} · ${isAudioFormat ? 'LISTEN' : (current.format === 'cloze' && clozeBlank ? 'FILL IN THE BLANK' : (current.direction === 'es-en' ? 'ES → EN' : 'EN → ES'))}`
      : `${state.index + 1} / ${state.questions.length} · ${(current.format === 'cloze' && clozeBlank) ? 'FILL IN THE BLANK' : (current.direction === 'es-en' ? 'ES → EN' : 'EN → ES')}`;

    const orbHtml = state.isStreamRound
      ? `<div class="glow-orb-progress streak-orb"><div class="orb-num">🔥${state.progress.streak.current}</div><div class="orb-lbl">STREAK</div></div>`
      : `<div class="glow-orb-progress"><div class="orb-num">${state.index + 1}</div><div class="orb-lbl">OF ${state.questions.length}</div></div>`;

    // One instruction line, computed once here so every mode that shares
    // this screen (Quiz, Daily Double, Categories, Stream) gets it for
    // free rather than needing separate wiring per mode. Audio format
    // already has its own hint ("Listen, then choose...") below, so it's
    // skipped here to avoid saying the same thing twice.
    const instructionText = isAudioFormat ? '' : (current.format === 'cloze' && clozeBlank) ? 'Type the missing word'
      : clozeFallback ? 'Type the word in Spanish'
      : useChoice
      ? (current.direction === 'es-en' ? 'What does this mean?' : 'How do you say this in Spanish?')
      : (current.direction === 'es-en' ? 'Type the English translation' : 'Type the word in Spanish');

    // Audio format hides the written word entirely — listening is the
    // exercise — and always speaks it (see the autoSpeak binding below),
    // regardless of the user's own "speak words aloud" setting. Cloze
    // shows the sentence with the target word blanked instead of a single
    // big prompt word; if the blank couldn't be found (shouldn't happen —
    // buildStreamBatch already checks — but a defensive fallback matters
    // more than a broken screen) it just renders like a normal typed
    // question instead.
    const promptRowHtml = isAudioFormat
      ? `<button id="speak-prompt-btn" class="speak-btn big" title="Hear it">🔊</button><div class="audio-hint">Listen, then choose the meaning</div>`
      : (current.format === 'cloze' && clozeBlank)
      ? `<div class="audio-hint" style="margin-bottom:10px;">${instructionText}</div><div class="cloze-sentence">${esc(clozeBlank.before)}<span class="cloze-blank">____</span>${esc(clozeBlank.after)}</div><div class="prompt-row" style="margin-top:10px;"><button id="speak-prompt-btn" class="speak-btn" title="Hear it">🔊</button><button id="hint-btn" class="hint-btn" title="Hear the full sentence">Hint</button></div>`
      : `<div class="audio-hint" style="margin-bottom:10px;">${instructionText}</div><div class="prompt-row"><div class="prompt-word">${esc(promptWord)}</div><button id="speak-prompt-btn" class="speak-btn" title="Hear it">🔊</button></div>${promptNote ? `<div class="prompt-note">${esc(promptNote)}</div>` : ''}`;

    let bottomHtml;

    if (useChoice) {
      const acceptable = splitAnswers(current.direction === 'es-en' ? current.en : current.es).map(normalize);
      let optionsHtml = '<div class="option-list" id="options-container">';
      state.currentOptions.forEach((opt) => {
        let cls = 'option-btn';
        if (state.checked) {
          const isCorrectOpt = acceptable.includes(normalize(opt));
          if (isCorrectOpt) cls += ' correct-choice pop-anim';
          else if (opt === state.selectedOption) cls += ' wrong-choice shake-anim';
        }
        optionsHtml += `<button class="${cls}" ${state.checked ? 'disabled' : ''}>${esc(opt)}</button>`;
      });
      optionsHtml += '</div>';

      let feedbackHtml = '';
      if (state.checked) {
        if (state.wasCorrect) {
          feedbackHtml = `<div class="feedback correct"><div class="title">✅ Correct</div></div>`;
        } else {
          feedbackHtml = `
            <div class="feedback wrong"><div class="title">❌ Not quite</div></div>
            <button id="next-btn" class="btn-primary">Next word</button>
            <div class="countdown-bar-track"><div class="countdown-bar-fill" id="countdown-fill"></div></div>
          `;
        }
      }
      bottomHtml = optionsHtml + feedbackHtml;
    } else if (!state.checked) {
      bottomHtml = `
        <input id="answer-input" type="text" placeholder="Type the translation…" value="${esc(state.input)}" autocomplete="off" />
        <button id="check-btn" class="btn-primary">Check</button>
      `;
    } else if (state.wasCorrect) {
      // Matches choice mode's correct state: no button, auto-advance only
      // (see submitAnswer). A near-miss now also shows the correct
      // spelling, not just "close enough" — you were forgiven, but you
      // should still see the right answer.
      bottomHtml = `
        <div class="feedback correct">
          <div class="title">✅ Correct</div>
          ${state.lastWasTypo ? `<div class="answer">✓ Close enough — small typo forgiven. Correct spelling: <strong>${esc(answerWord)}</strong>${answerNote ? ` (${esc(answerNote)})` : ''} <button id="speak-answer-btn" class="speak-btn" title="Hear it" style="width:26px;height:26px;font-size:12px;">🔊</button></div>` : ''}
        </div>
      `;
    } else {
      bottomHtml = `
        <div class="feedback wrong">
          <div class="title">❌ Not quite</div>
          <div class="answer">Correct answer: <strong>${esc(answerWord)}</strong>${answerNote ? ` (${esc(answerNote)})` : ''} <button id="speak-answer-btn" class="speak-btn" title="Hear it" style="width:26px;height:26px;font-size:12px;">🔊</button></div>
        </div>
        <button id="next-btn" class="btn-primary">${state.index + 1 >= state.questions.length ? 'See results' : 'Next word'}</button>
        <div class="countdown-bar-track"><div class="countdown-bar-fill" id="countdown-fill"></div></div>
      `;
    }

    app.innerHTML = `
      <div class="screen bg-quiz">
        <div class="wrap">
          <div class="tiles" style="grid-template-columns: repeat(${state.isStreamRound ? STREAM_CHECKPOINT_SIZE : Math.min(state.questions.length, 20)}, 1fr);">${tilesHtml}</div>
          <div class="progress-label">${progressLabel}</div>
          <div class="prompt-card ${shouldFlip ? 'card-flip-in' : ''}">
            ${orbHtml}
            ${promptRowHtml}
          </div>
          ${bottomHtml}
          <button id="quiz-quit-btn" class="quit-link" style="display:block; text-align:center; width:100%; margin-top:14px;">Quit</button>
        </div>
      </div>
    `;

    const speakPromptBtn = document.getElementById('speak-prompt-btn');
    speakPromptBtn.addEventListener('click', () => speak(promptWord, promptLang, speakPromptBtn));
    const hintBtn = document.getElementById('hint-btn');
    // Using this doesn't affect scoring, streaks, or SRS progress in any
    // way - hearing the word and still being able to type it correctly is
    // treated exactly like any other correct answer (deliberate decision;
    // most players are expected to only reach for it when needed).
    if (hintBtn) hintBtn.addEventListener('click', () => speak(current.sentence, 'es-ES', hintBtn));
    const shouldAutoSpeak = isAudioFormat || state.progress.settings.autoSpeak;

    if (useChoice) {
      if (!state.checked) {
        document.querySelectorAll('#options-container .option-btn').forEach((btn, i) => {
          btn.addEventListener('click', () => selectOption(state.currentOptions[i]));
        });
        if (shouldAutoSpeak) speak(promptWord, promptLang, speakPromptBtn);
      } else if (!state.wasCorrect) {
        document.getElementById('next-btn').addEventListener('click', nextQuestion);
        const fill = document.getElementById('countdown-fill');
        if (fill) {
          requestAnimationFrame(() => { requestAnimationFrame(() => { fill.style.width = '0%'; }); });
        }
      }
    } else if (!state.checked) {
      const input = document.getElementById('answer-input');
      input.focus();
      input.addEventListener('input', (e) => { state.input = e.target.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.stopPropagation();
          submitAnswer();
        }
      });
      document.getElementById('check-btn').addEventListener('click', submitAnswer);
      if (shouldAutoSpeak) speak(promptWord, promptLang, speakPromptBtn);
    } else if (!state.wasCorrect) {
      document.getElementById('next-btn').addEventListener('click', nextQuestion);
      const speakAnswerBtn = document.getElementById('speak-answer-btn');
      if (speakAnswerBtn) speakAnswerBtn.addEventListener('click', () => speak(answerWord, answerLang, speakAnswerBtn));
      const fill = document.getElementById('countdown-fill');
      if (fill) {
        requestAnimationFrame(() => { requestAnimationFrame(() => { fill.style.width = '0%'; }); });
      }
    } else {
      // typed correct (possibly a forgiven near-miss) — no Next button,
      // matches choice mode's silent auto-advance-only correct state.
      const speakAnswerBtn = document.getElementById('speak-answer-btn');
      if (speakAnswerBtn) speakAnswerBtn.addEventListener('click', () => speak(answerWord, answerLang, speakAnswerBtn));
    }

    document.getElementById('quiz-quit-btn').addEventListener('click', quitQuiz);
  }

  // Brief celebratory interstitial shown between a round ending and its
  // results screen. Two variants (perfect / finished) shared across every
  // game mode; the background glow is picked from whichever results screen
  // it's about to hand off to, so it reads as a continuation, not a detour.
  function renderCelebrate() {
    const app = document.getElementById('app');
    const isPerfect = state.celebrateVariant === 'perfect';

    let bgClass = 'bg-quiz';
    if (state.celebrateNext === 'memory-result') bgClass = 'bg-memory';
    else if (state.celebrateNext === 'conjugate-result') bgClass = 'bg-conjugate';
    else if (state.celebrateNext === 'result') bgClass = state.resultMode === 'timeattack' ? 'bg-timeattack' : 'bg-quiz';

    app.innerHTML = `
      <div class="screen ${bgClass} celebrate-screen" id="celebrate-screen-el">
        <div class="celebrate-wrap">
          <div class="celebrate-badge-ring ${isPerfect ? 'perfect' : ''}">
            <div class="celebrate-badge-disc">${isPerfect ? '💯' : '🙌'}</div>
          </div>
          <div class="celebrate-headline ${isPerfect ? 'perfect' : 'finished'}">${isPerfect ? '¡Perfecto!' : '¡Ronda completa!'}</div>
          <p class="celebrate-subline">${isPerfect ? 'Not a single mistake.' : 'Round complete.'}</p>
        </div>
        <div class="tap-hint">Tap to continue</div>
      </div>
    `;
    document.getElementById('celebrate-screen-el').addEventListener('click', advanceFromCelebration);

    if (isPerfect) {
      launchConfetti();
      playPerfectFanfare();
    } else {
      playFinishedChime();
    }
  }

  // Every 10 Stream questions — a soft checkpoint, not a hard stop. Same
  // visual family as Celebrate (badge/headline/subline) but a genuine
  // two-way choice instead of a single tap-anywhere-to-continue, since
  // "keep going" and "stop" lead somewhere different here.
  function renderStreamCheckpoint() {
    const app = document.getElementById('app');
    const recentResults = state.results.slice(state.results.length - STREAM_CHECKPOINT_SIZE);
    const correctInBlock = recentResults.filter(r => r.correct).length;

    app.innerHTML = `
      <div class="screen bg-quiz stream-checkpoint-screen">
        <div class="celebrate-wrap">
          <div class="celebrate-badge-ring">
            <div class="celebrate-badge-disc">🔥</div>
          </div>
          <div class="celebrate-headline finished">${correctInBlock}/${STREAM_CHECKPOINT_SIZE} in a row!</div>
          <p class="celebrate-subline">Keep going, or stop here for now.</p>
          <div class="checkpoint-actions">
            <button id="stream-continue-btn" class="btn-primary">Keep going →</button>
            <button id="stream-stop-btn" class="link-btn">Stop for today</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('stream-continue-btn').addEventListener('click', continueStream);
    document.getElementById('stream-stop-btn').addEventListener('click', stopStream);
  }

  // Shown once, right after a results screen is left, if a level-up
  // happened at any point during that round (see leaveResults() /
  // checkLevelUp()). Uses a fixed gold theme rather than picking up

  // four games, not a per-game moment the way Celebrate is.

        <div class="levelup-wrap">

            <div class="levelup-disc">
              <div class="levelup-disc-inner"><span class="levelup-num">${level}</span></div>
            </div>
          </div>
          <h1 class="levelup-headline">Level Up!</h1>
          <p class="levelup-subline">You reached Level ${level}</p>
        </div>
        <div class="tap-hint">Tap to continue</div>
      </div>
    `;
    document.getElementById('levelup-screen-el').addEventListener('click', advanceFromLevelUp);
    playLevelUpFanfare();

  function renderResult() {
    const app = document.getElementById('app');
    const score = state.results.filter(r => r.correct).length;
    const total = state.results.length;

            ${r.userAnswer ? `<div class="yours">You wrote: ${esc(r.userAnswer)}</div>` : ''}
          </div>

            <div class="streak-line">Current streak: ${streak.current} &nbsp;·&nbsp; Best: ${streak.best}</div>

          </div>

  function renderMyProgress() {
    const app = document.getElementById('app');
    const p = state.progress;

    const vocabAccuracy = p.lifetime.totalAnswered > 0
      ? Math.round((p.lifetime.totalCorrect / p.lifetime.totalAnswered) * 100) : 0;
    const conjAccuracy = p.conjugateLifetime.totalAnswered > 0
      ? Math.round((p.conjugateLifetime.totalCorrect / p.conjugateLifetime.totalAnswered) * 100) : 0;

    const wordCounts = boxCounts(p.wordStats);
    const verbCounts = boxCounts(p.verbStats);
    const wordMax = Math.max(1, ...wordCounts);
    const verbMax = Math.max(1, ...verbCounts);

  // Tracks the previous screen so render() can tell a real navigation
  // (scroll should jump to top) apart from an in-screen re-render like
  // checking a quiz answer or toggling the menu (scroll should stay put).
  let lastScreen = null;

  // ---- Hardware/browser back button ------------------------------------
  // By default a phone's back button/gesture has nothing of this app's own
  // to act on (no history entries are pushed anywhere), so it falls straight
  // through to whatever's underneath - the previous website in a normal
  // browser tab, or closing the Activity entirely in the APK. This section
  // makes back navigate within the app instead, using the History API.
  //
  // Design: every non-floor screen gets its own real history entry - no
  // attempt to collapse multiple menu levels into a shared slot (an earlier
  // version tried that and broke as soon as the user went two levels deep,
  // e.g. Achievements -> an achievement group - because going deeper just
  // relabelled the one entry instead of adding a new one, so there was only
  // ever a single real pop available no matter how many screens you'd
  // actually visited). Landing back on the floor (start/login) instead
  // sheds everything accumulated in one `history.go()` jump, so exact depth
  // never has to matter once you're home again - a further back press there
  // genuinely exits (closes the APK / leaves to the previous page).
  //
  // Every screen falls into exactly one of three special buckets:
  //   - floor: start, login - see above.
  //   - swallow: round-end / celebration screens - back does nothing at
  //     all. These are reached automatically (timers, round completion),
  //     never chosen by the user, so there's nothing sensible to return to.
  //   - quit: the four active-play screens - back triggers the exact same
  //     "quit this round?" confirm as the on-screen Quit button, not real
  //     navigation.
  // Everything else (menu/setup/detail screens) already has its own
  // "back-btn" wired by its render function - hardware back just clicks it,
  // so behavior is guaranteed identical to tapping the on-screen arrow, and
  // the resulting screen change re-arms itself the normal way below.
  const BACK_FLOOR_SCREENS = new Set(['start', 'login']);
  const BACK_SWALLOW_SCREENS = new Set(['celebrate', 'level-up', 'stream-checkpoint', 'result', 'conjugate-result', 'memory-result']);
  const BACK_QUIT_HANDLERS = {
    quiz: quitQuiz,
    timeattack: quitTimeAttack,
    'memory-play': quitMemoryMatch,
    conjugate: quitConjugateRound,
  };

  let navDepth = 0; // how many of our own history entries currently exist beyond the floor
  let ignoreNextPopstate = false; // set right before a programmatic history.back()/go() we don't want to react to

  // Called at the end of every real screen change (see the render() hook
  // below). Deliberately doesn't try to tell "going deeper" apart from
  // "going back a level" - every non-floor transition just gets its own
  // pushed entry either way, and reaching the floor sheds all of them in
  // one jump. Depth can grow larger than the "true" menu depth over a long
  // session (e.g. cycling in and out of a screen a few times) - that's
  // harmless; it all collapses the moment the user reaches Home again.
  function syncBackHistory() {
    console.log('[DIAG] syncBackHistory() ENTER  screen=' + state.screen + '  navDepth(js)=' + navDepth + '  history.length=' + history.length + '  history.state=' + JSON.stringify(history.state) + '  url=' + location.href);
    if (BACK_FLOOR_SCREENS.has(state.screen)) {
      if (navDepth > 0) {
        const steps = navDepth;
        navDepth = 0;
        ignoreNextPopstate = true;
        console.log('[DIAG]   -> FLOOR branch: calling history.go(-' + steps + ')  (history.length=' + history.length + ')');
        history.go(-steps);
      } else {
        console.log('[DIAG]   -> FLOOR branch: navDepth already 0, no-op');
      }
      return;
    }
    navDepth += 1;
    history.pushState({ navDepth }, '');
    console.log('[DIAG]   -> pushed navDepth=' + navDepth + '  history.length(after)=' + history.length + '  history.state(after)=' + JSON.stringify(history.state));
  }

  window.addEventListener('popstate', () => {
    console.log('[DIAG] popstate FIRED  ignoreNextPopstate=' + ignoreNextPopstate + '  navDepth(js,before)=' + navDepth + '  screen(js)=' + state.screen + '  history.length=' + history.length + '  history.state=' + JSON.stringify(history.state) + '  url=' + location.href);
    if (ignoreNextPopstate) { ignoreNextPopstate = false; console.log('[DIAG]   -> swallowed (was the programmatic go() we triggered ourselves)'); return; }

    // Ground truth for how deep we actually landed, read straight off the
    // entry itself - never assumed. A single native back doesn't always
    // consume exactly one of our pushed entries: fast back presses/gestures
    // can get queued by the browser and resolved together against the
    // position that existed before any of them fired, so one popstate can
    // land us several of our entries deeper than navDepth (which only ever
    // assumed "-1 per event") expects. Trusting the entry's own stored state
    // instead of our running counter keeps us in sync no matter how many
    // levels one popstate actually skipped - and stops the floor-collapse
    // below from calling history.go() an extra, unwarranted time and
    // overshooting past the real bottom of the stack (which is what was
    // exiting the app/tab a press early).
    const landedDepth = (history.state && typeof history.state.navDepth === 'number')
      ? history.state.navDepth : 0;
    console.log('[DIAG]   landedDepth=' + landedDepth);

    if (landedDepth <= 0 && BACK_FLOOR_SCREENS.has(state.screen)) {
      console.log('[DIAG]   -> already-home branch: letting this genuinely exit');
      // Already home, and the browser already put us at (or before) the
      // floor for real - nothing left to trap, let this one genuinely exit.
      navDepth = 0;
      return;
    }
    navDepth = landedDepth; // resync to reality before anything else touches it

    const screen = state.screen;
    if (BACK_SWALLOW_SCREENS.has(screen)) {
      // Nothing should happen - re-arm so a trap entry exists for next time.
      navDepth += 1;
      history.pushState({ navDepth }, '');
      return;
    }
    if (BACK_QUIT_HANDLERS[screen]) {
      const depthBeforeHandler = navDepth;
      BACK_QUIT_HANDLERS[screen](); // may show a confirm; if confirmed this changes state.screen and calls render(), which re-arms itself via syncBackHistory()
      if (navDepth === depthBeforeHandler) {
        // Cancelled - nothing changed, so render() never got a chance to
        // re-arm. Do it manually so the trap is still there next time.
        navDepth += 1;
        history.pushState({ navDepth }, '');
      }
      return;
    }
    console.log('[DIAG]   -> dispatch branch: screen=' + screen + '  navDepth(resynced)=' + navDepth);
    const backBtn = document.getElementById('back-btn');
    if (backBtn) { console.log('[DIAG]   -> clicking existing #back-btn for screen=' + screen); backBtn.click(); }
    else { console.log('[DIAG]   -> NO #back-btn found for screen=' + screen + ', manual rearm'); navDepth += 1; history.pushState({ navDepth }, ''); }
  });

  function render() {
    const isNewScreen = state.screen !== lastScreen;
    lastScreen = state.screen;

    if (state.screen === 'login') renderLogin();

    else if (state.screen === 'game-modes') renderGameModes();

    else if (state.screen === 'conjugate') renderConjugate();
    else if (state.screen === 'conjugate-result') renderConjugateResult();
    else if (state.screen === 'quiz') renderQuiz();
    else if (state.screen === 'timeattack-setup') renderTimeAttackSetup();
    else if (state.screen === 'timeattack') renderTimeAttack();

    else if (state.screen === 'xp-info') renderXPInfo();

    if (isNewScreen) syncBackHistory();

  // Single, stable listener for advancing on Enter from the feedback screen.
  // (Installed once — not re-created per render — so it can never stack up.)
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;

  // Checks for an existing signed-in session and decides login vs hub.
  // Independent of the word/verb list loading below — vocab data isn't
  // user-specific, so both can happen in parallel.
  initAuth();

  loadFromRepo();

  // Verbs, categories, and everything else now come from the single sheet
  // loaded above — parseRows() derives state.verbPairs automatically as
  // soon as it resolves, no separate fetch needed (see loadVerbsFile's own
  // comment for the still-needed synchronous fallback it provides).

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {
        // Not fatal — the app still works online without it
      });
    });
  }

  // Flags that progress may be stale after using the app elsewhere (another
  // tab, another device). If already on the hub, syncs immediately; if not,
  // renderStart() picks the flag up as soon as the hub is next shown —
  // covers both "switched tabs while on the hub" and "switched tabs, then
  // navigated back to the hub afterward".
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.user) {
      state.needsCloudSync = true;
      if (state.screen === 'start') render();
    }
  });

  // ---- Keyboard-safe scrolling ----------------------------------------
  // interactive-widget=resizes-content (viewport meta, see <head>) makes
  // Chrome actually shrink the page around the on-screen keyboard instead
  // of just overlaying it — but that alone only guarantees the *focused*
  // input scrolls into view, not whatever comes after it. On a typed-answer
  // screen (Quiz, Conjugate, Time Attack) or the login form, that's the
  // Check/Sign in/Save button, and it can still end up just out of sight
  // below a short keyboard-shrunk viewport, worse with Chrome's own
  // autofill accessory bar eating extra height on top of the keyboard.
  //
  // Rather than hard-coding this per screen, walk forward from whatever
  // input is focused (through siblings, then up to the parent's siblings
  // if it runs out, stopping at #app) until a primary/secondary action
  // button is found, and bring that into view instead of just the input.
  // Works for every current typed-input screen and any future one without
  // needing to be wired up again each time.
  function findNextActionButton(el, hops) {
    if (!el || hops > 8) return null;
    let node = el;
    while (node) {
      const sib = node.nextElementSibling;
      if (sib) {
        if (sib.tagName === 'BUTTON' && (sib.classList.contains('btn-primary') || sib.classList.contains('btn-secondary'))) return sib;
        const nested = sib.querySelector && sib.querySelector('.btn-primary, .btn-secondary');
        if (nested) return nested;
        node = sib;
      } else {
        node = node.parentElement;
        if (!node || node.id === 'app') return null;
      }
    }
    return null;
  }

  function scrollKeyboardTargetIntoView(active) {
    if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA')) return;
    const target = findNextActionButton(active, 0) || active;
    target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Two independent triggers, deliberately redundant, since a single
  // heuristic already failed once here:
  // 1) visualViewport resize — fires when the keyboard genuinely changes
  //    the visible area. Under interactive-widget=resizes-content the
  //    layout viewport shrinks together with the visual one, so there's
  //    no reliable "gap" to gate on — just react to any resize while an
  //    input is focused rather than trying to guess whether it was the
  //    keyboard specifically.
  // 2) focusin, on a longer delay — a fallback in case the resize event
  //    fires before the keyboard animation has actually settled, or
  //    doesn't fire as expected on a given device/Chrome version.
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      setTimeout(() => scrollKeyboardTargetIntoView(document.activeElement), 80);
    });
  }
  document.addEventListener('focusin', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      setTimeout(() => scrollKeyboardTargetIntoView(e.target), 350);
    }
  });
</script>
</body>
</html>
