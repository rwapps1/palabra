  function normalize(str) {
    return str.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function splitAnswers(cell) {
    return cell.toString().split(/[/;,]/).map(s => s.trim()).filter(Boolean);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function wordKey(pair) {
    return normalize(pair.es) + '::' + normalize(pair.en);
  }

  // Anywhere a field is being displayed as a single word - a prompt, or a
  // "Correct answer:" reveal - rather than checked against, only the first
  // slash-separated alternative should show. Matching still checks all of
  // them via splitAnswers(); this is display-only.
  function primaryText(field) {
    return splitAnswers(field)[0] || '';
  }

  // The field a question's typed/chosen answer is actually checked
  // against. Cloze always tests the Spanish word itself, regardless of
  // the direction randomly assigned to that question - there's no
  // "translate this" step, just "what word is missing".
  function targetFieldFor(current) {
    if (current.format === 'cloze') return current.es;
    return current.direction === 'es-en' ? current.en : current.es;
  }

  // Finds pair.es (or its regular plural) inside pair.sentence and
  // returns the surrounding text split around it, ready to render with a
  // blank in place of the match. Mirrors the exact matching logic used to
  // author and validate the Sentence column, so anything that passed
  // validation there is guaranteed to blank cleanly here. Returns null if
  // the word truly isn't found (used both to disable cloze for a row at
  // load time and, defensively, again at render time).
  function findClozeBlank(pair) {
    if (!pair.sentence) return null;
    const es = pair.es;
    const forms = [es];
    if (/[aeiouáéíóú]$/i.test(es)) forms.push(es + 's');
    else if (/ón$/i.test(es)) forms.push(es.slice(0, -2) + 'ones');
    else if (/z$/i.test(es)) forms.push(es.slice(0, -1) + 'ces');
    else forms.push(es + 'es');
    const boundary = 'a-zA-ZáéíóúñÁÉÍÓÚÑ';
    for (const form of forms) {
      const escaped = form.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`(?<![${boundary}])${escaped}(?![${boundary}])`, 'i');
      const match = pair.sentence.match(re);
      if (match) {
        const idx = match.index;
        return {
          before: pair.sentence.slice(0, idx),
          matched: match[0],
          after: pair.sentence.slice(idx + match[0].length),
        };
      }
    }
    return null;
  }

  // The word pool every quiz-family function should read from: the active
  // category's words if one is selected, otherwise the main pool (which
  // already excludes conjugation-only verbs - see isMainPoolEligible).
  function activePairs() {
    return state.activeCategory ? state.categoryPairs : state.mainPool;
  }

  // The pool for Sentences mode - only main-pool words with an actual
  // usable sentence (findClozeBlank succeeds). Recomputed from state.mainPool
  // each time rather than cached, so it automatically tracks new sentences
  // added to words.xlsx without any extra wiring.
  function sentencePairs() {
    return state.mainPool.filter(p => findClozeBlank(p));
  }

  function getWeight(pair) {
    const stats = state.progress.wordStats[wordKey(pair)];
    const now = Date.now();
    if (!stats) return 12; // never seen - high priority
    const overdueMs = now - (stats.nextDue || 0);
    if (overdueMs >= 0) {
      // due or overdue - the longer overdue, the higher the priority
      const overdueDays = overdueMs / 86400000;
      return 6 + Math.min(overdueDays, 12) * 1.5;
    }
    // not yet due - small residual chance, higher the closer it is to becoming due
    const daysUntilDue = -overdueMs / 86400000;
    return Math.max(0.2, 3 / (1 + daysUntilDue * 2));
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0];
      dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const temp = dp[j];
        dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
        prev = temp;
      }
    }
    return dp[n];
  }

  function isCloseMatch(userNorm, ansNorm) {
    if (!userNorm || !ansNorm) return false;
    if (userNorm === ansNorm) return true;
    const dist = levenshtein(userNorm, ansNorm);
    const len = Math.max(userNorm.length, ansNorm.length);
    const threshold = Math.max(1, Math.round(len * 0.4));
    return dist <= threshold;
  }

  function isAnswerCorrect(input, targetField) {
    const userNorm = normalize(input);
    if (userNorm.length === 0) return false;
    const acceptable = splitAnswers(targetField).map(normalize);
    if (acceptable.includes(userNorm)) return true;
    return acceptable.some(ans => isCloseMatch(userNorm, ans));
  }

  function weightedSampleWithoutReplacement(items, weightFn, count) {
    const pool = items.map(item => ({ item, weight: Math.max(weightFn(item), 0.0001) }));
    const result = [];
    while (result.length < count && pool.length > 0) {
      const totalWeight = pool.reduce((sum, p) => sum + p.weight, 0);
      let r = Math.random() * totalWeight;
      let idx = 0;
      for (; idx < pool.length - 1; idx++) {
        r -= pool[idx].weight;
        if (r <= 0) break;
      }
      result.push(pool[idx].item);
      pool.splice(idx, 1);
    }
    return result;
  }

  function weightedPickOne(items, weightFn, excludeKey) {
    let pool = items;
    if (excludeKey && items.length > 1) {
      const filtered = items.filter(p => wordKey(p) !== excludeKey);
      if (filtered.length > 0) pool = filtered;
    }
    const weights = pool.map(p => Math.max(weightFn(p), 0.0001));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function buildRound(pairs, length, directionSetting) {
    let selected = [];
    while (selected.length < length) {
      const remaining = length - selected.length;
      const batchSize = Math.min(remaining, pairs.length);
      const batch = weightedSampleWithoutReplacement(pairs, getWeight, batchSize);
      selected = selected.concat(batch);
    }
    return selected.map(p => ({
      ...p,
      direction: directionSetting === 'mixed' ? (Math.random() < 0.5 ? 'es-en' : 'en-es') : directionSetting,
    }));
  }

  // Builds `count` more Stream questions, each carrying its own answer
  // format (mc / audio / type) so the format varies question to question
  // instead of being fixed for the whole round like normal Quiz. Uses the
  // same weighted due/never-seen selection as everything else (getWeight),
  // sampling WITH replacement (via weightedPickOne) since a continuous
  // stream can't rely on a finite without-replacement pool the way a
  // fixed-length round does.
  function buildStreamBatch(pairs, count, avoidKey, startPosition) {
    const batch = [];
    let lastKey = avoidKey || null;
    for (let i = 0; i < count; i++) {
      const p = weightedPickOne(pairs, getWeight, lastKey);
      lastKey = wordKey(p);
      let format = STREAM_FORMATS[(startPosition + i) % STREAM_FORMATS.length];
      // Cloze only works for words that actually have sentence data -
      // most won't yet. Falling back to typed translation keeps the
      // rotation's cadence intact instead of skipping this word entirely.
      if (format === 'cloze' && !findClozeBlank(p)) format = 'type';
      batch.push({
        ...p,
        direction: Math.random() < 0.5 ? 'es-en' : 'en-es',
        // Cycles on a running position (not i, which resets every batch)
        // so format rotation stays deliberate across batch top-ups instead
        // of risking two of the same format landing back-to-back at a
        // batch boundary.
        format,
      });
    }
    return batch;
  }

  function getDistractors(current, correctText, count) {
    const isEnglishTarget = current.direction === 'es-en';
    const seen = new Set([normalize(correctText)]);
    const candidates = [];
    activePairs().forEach(p => {
      if (wordKey(p) === wordKey(current)) return;
      const field = isEnglishTarget ? p.en : p.es;
      const text = splitAnswers(field)[0];
      if (!text) return;
      const n = normalize(text);
      if (seen.has(n)) return;
      seen.add(n);
      candidates.push(text);
    });
    return shuffle(candidates).slice(0, count);
  }

  // ---- Conjugation engine (present tense, indicative) ----
  // Person order: 0=yo, 1=tú, 2=él/ella/usted, 3=nosotros, 4=vosotros, 5=ellos/ellas/ustedes
  const PERSON_LABELS = ['yo', 'tú', 'él / ella / usted', 'nosotros', 'vosotros', 'ellos / ellas / ustedes'];
  const REFLEXIVE_PRONOUNS = ['me', 'te', 'se', 'nos', 'os', 'se'];

  const REGULAR_ENDINGS = {
    ar: ['o', 'as', 'a', 'amos', 'áis', 'an'],
    er: ['o', 'es', 'e', 'emos', 'éis', 'en'],
    ir: ['o', 'es', 'e', 'imos', 'ís', 'en'],
  };

  const IRREGULAR_VERBS = {
    ser: ['soy', 'eres', 'es', 'somos', 'sois', 'son'],
    estar: ['estoy', 'estás', 'está', 'estamos', 'estáis', 'están'],
    ir: ['voy', 'vas', 'va', 'vamos', 'vais', 'van'],
    haber: ['he', 'has', 'ha', 'hemos', 'habéis', 'han'],
    dar: ['doy', 'das', 'da', 'damos', 'dais', 'dan'],
    ver: ['veo', 'ves', 've', 'vemos', 'veis', 'ven'],
    oír: ['oigo', 'oyes', 'oye', 'oímos', 'oís', 'oyen'],
    oler: ['huelo', 'hueles', 'huele', 'olemos', 'oléis', 'huelen'],
    reír: ['río', 'ríes', 'ríe', 'reímos', 'reís', 'ríen'],
    sonreír: ['sonrío', 'sonríes', 'sonríe', 'sonreímos', 'sonreís', 'sonríen'],
    enviar: ['envío', 'envías', 'envía', 'enviamos', 'enviáis', 'envían'],
  };

  const YO_IRREGULAR = {
    tener: 'tengo', hacer: 'hago', poner: 'pongo', salir: 'salgo',
    traer: 'traigo', saber: 'sé', caber: 'quepo', valer: 'valgo',
    conocer: 'conozco', conducir: 'conduzco', traducir: 'traduzco',
    parecer: 'parezco', ofrecer: 'ofrezco', decir: 'digo', venir: 'vengo',
    caer: 'caigo', agradecer: 'agradezco', nacer: 'nazco',
    seguir: 'sigo',
  };

  const STEM_CHANGES = {
    querer: 'e-ie', pensar: 'e-ie', perder: 'e-ie', entender: 'e-ie',
    cerrar: 'e-ie', empezar: 'e-ie', comenzar: 'e-ie', preferir: 'e-ie',
    sentir: 'e-ie', tener: 'e-ie', venir: 'e-ie', encender: 'e-ie', despertar: 'e-ie',
    nevar: 'e-ie', sentar: 'e-ie',
    poder: 'o-ue', dormir: 'o-ue', volver: 'o-ue', contar: 'o-ue',
    encontrar: 'o-ue', recordar: 'o-ue', mostrar: 'o-ue', costar: 'o-ue',
    mover: 'o-ue', volar: 'o-ue', acostar: 'o-ue', morir: 'o-ue', llover: 'o-ue',
    pedir: 'e-i', servir: 'e-i', repetir: 'e-i', seguir: 'e-i', decir: 'e-i',
    vestir: 'e-i', despedir: 'e-i', competir: 'e-i',
    jugar: 'u-ue',
    construir: 'y-insert',
  };
  const BOOT_PERSONS = [0, 1, 2, 5];
  const IMPERSONAL_VERBS = ['llover', 'nevar'];

  function applyStemChange(stem, type) {
    if (type === 'y-insert') return stem + 'y';
    const map = { 'e-ie': ['e', 'ie'], 'o-ue': ['o', 'ue'], 'e-i': ['e', 'i'], 'u-ue': ['u', 'ue'] };
    const [from, to] = map[type];
    const idx = stem.lastIndexOf(from);
    if (idx === -1) return stem;
    return stem.slice(0, idx) + to + stem.slice(idx + from.length);
  }

  function conjugateBase(inf, personIndex) {
    if (IRREGULAR_VERBS[inf]) return IRREGULAR_VERBS[inf][personIndex];
    const ending = inf.slice(-2);
    const stem = inf.slice(0, -2);
    if (!['ar', 'er', 'ir'].includes(ending)) return null;
    if (personIndex === 0 && YO_IRREGULAR[inf]) return YO_IRREGULAR[inf];
    let effectiveStem = stem;
    const changeType = STEM_CHANGES[inf];
    if (changeType && BOOT_PERSONS.includes(personIndex)) {
      effectiveStem = applyStemChange(stem, changeType);
    }
    return effectiveStem + REGULAR_ENDINGS[ending][personIndex];
  }

  // Returns the conjugated form (a single word, or "pronoun verb" for
  // reflexives), or null if the verb's shape isn't recognized at all.
  function conjugatePresent(infinitive, personIndex) {
    const inf = infinitive.toLowerCase().trim();
    if (inf.endsWith('se') && inf.length > 2) {
      const base = inf.slice(0, -2);
      if (['ar', 'er', 'ir'].includes(base.slice(-2))) {
        const baseForm = conjugateBase(base, personIndex);
        if (baseForm === null) return null;
        return REFLEXIVE_PRONOUNS[personIndex] + ' ' + baseForm;
      }
    }
    return conjugateBase(inf, personIndex);
  }

  function validPersonsFor(infinitive) {
    return IMPERSONAL_VERBS.includes(infinitive.toLowerCase().trim()) ? [2] : [0, 1, 2, 3, 4, 5];
  }

  function speak(text, lang, btnEl) {
    if (!('speechSynthesis' in window)) return;
    try {
      // Chrome has a well-documented race condition where an unconditional
      // cancel() immediately followed by speak() can silently drop the
      // very first utterance of a session — the synthesis engine hasn't
      // "woken up" yet, and cancelling something that was never speaking
      // in the first place can still leave it in a state where the next
      // speak() call gets lost. Only cancel if something's actually
      // in-flight, and give the engine a brief moment before speaking
      // rather than calling speak() in the same synchronous tick as the
      // render that triggered it.
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      if (btnEl) {
        utter.onstart = () => btnEl.classList.add('speaking');
        utter.onend = () => btnEl.classList.remove('speaking');
        utter.onerror = () => btnEl.classList.remove('speaking');
      }
      setTimeout(() => {
        try { window.speechSynthesis.speak(utter); } catch (e) {}
      }, 50);
    } catch (e) {
      // speech is a nice-to-have, never let it break the quiz
    }
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!('AudioContext' in window || 'webkitAudioContext' in window)) return null;
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playNote(ctx, freq, startTime, duration, type, peakGain) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(peakGain || 0.22, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }

  // Brassier note for the "perfect round" fanfare: sawtooth + triangle
  // layered through a lowpass filter, rounding the sawtooth's harsh edge
  // into something closer to a horn than a chime.
  function playBrassNote(ctx, freq, startTime, duration, peakGain) {
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 3200;
    filter.Q.value = 0.7;
    filter.connect(ctx.destination);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    gain.connect(filter);

    const osc1 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.value = freq;
    osc1.connect(gain);

    const osc2 = ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.value = freq;
    osc2.connect(gain);

    osc1.start(startTime); osc1.stop(startTime + duration + 0.05);
    osc2.start(startTime); osc2.stop(startTime + duration + 0.05);
  }

  function playCorrectSound() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    playNote(ctx, 523.25, now, 0.12, 'sine');
    playNote(ctx, 659.25, now + 0.09, 0.16, 'sine');
  }

  function playWrongSound() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    playNote(ctx, 196, now, 0.25, 'sawtooth');
  }

  function playAchievementSound() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    playNote(ctx, 523.25, now, 0.12, 'triangle');
    playNote(ctx, 659.25, now + 0.1, 0.12, 'triangle');
    playNote(ctx, 783.99, now + 0.2, 0.2, 'triangle');
  }

  // Round-end celebration sounds. Same gating convention as the other
  // sound effects (respects the Sound effects setting).
  function playPerfectFanfare() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    // low thump under the badge pop-in, for weight
    playNote(ctx, 110, now, 0.2, 'sine', 0.2);
    // ascending bugle-call fanfare (sol-do-mi-sol-do): short-short-short-
    // short then a longer sustained landing note
    const notes = [392.00, 523.25, 659.25, 783.99, 1046.50];
    const step = 0.11;
    notes.forEach((freq, i) => {
      const isLast = i === notes.length - 1;
      playBrassNote(ctx, freq, now + 0.05 + i * step, isLast ? 0.5 : 0.12, isLast ? 0.24 : 0.17);
    });
  }

  function playFinishedChime() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    playNote(ctx, 110, now, 0.18, 'sine', 0.18);
    playNote(ctx, 523.25, now + 0.05, 0.16, 'triangle');
    playNote(ctx, 659.25, now + 0.15, 0.16, 'triangle');
    playNote(ctx, 783.99, now + 0.25, 0.18, 'triangle');
    playNote(ctx, 1046.5, now + 0.36, 0.32, 'triangle', 0.18);
  }

  // Level-up fanfare — an ascending trumpet-style call (same playBrassNote
  // instrument as the Perfect-round fanfare above) landing on a held final
  // note. Deliberately single-note voicing the whole way through, no
  // simultaneous chord and no gap before the landing note — both were
  // tried and ended up sounding like a different instrument bolted on
  // after a pause, rather than one continuous phrase.
  function playLevelUpFanfare() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    playBrassNote(ctx, 110, now, 0.4, 0.24); // low brass foundation note
    const runNotes = [523.25, 659.25, 783.99, 1046.50]; // C5 - E5 - G5 - C6
    const step = 0.14;
    runNotes.forEach((freq, i) => {
      const isLast = i === runNotes.length - 1;
      playBrassNote(ctx, freq, now + 0.12 + i * step, isLast ? 0.9 : 0.18, isLast ? 0.26 : 0.22);
    });
  }

  function showAchievementToast(id) {
    const def = ACHIEVEMENTS[id];
    if (!def) return;
    const toast = document.createElement('div');
    toast.className = 'achievement-toast';
    toast.innerHTML = `<div class="toast-icon">${def.icon}</div><div><div class="toast-title">Achievement unlocked</div><div class="toast-name">${esc(def.name)}</div></div>`;
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.classList.add('show'); });
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 400);
    }, 2600);
  }

  function showComingSoonToast(icon, name) {
    const toast = document.createElement('div');
    toast.className = 'achievement-toast';
    toast.innerHTML = `<div class="toast-icon">${icon}</div><div><div class="toast-title">Coming soon</div><div class="toast-name">${esc(name)}</div></div>`;
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.classList.add('show'); });
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 400);
    }, 2000);
  }

  // While true, unlockAchievement() queues its toast/sound instead of
  // firing immediately — used around round-end achievement checks so an
  // achievement toast doesn't pop up on top of the full-screen celebration.
  // The unlock itself (and saveProgress) still happens right away either way.
  let suppressAchievementFX = false;

  function unlockAchievement(id) {
    if (!ACHIEVEMENTS[id]) return false;
    if (!state.progress.achievements) state.progress.achievements = {};
    if (state.progress.achievements[id] && state.progress.achievements[id].unlocked) return false;
    state.progress.achievements[id] = { unlocked: true, unlockedAt: Date.now() };
    saveProgress();
    if (suppressAchievementFX) {
      state.queuedAchievementToasts.push(id);
    } else {
      playAchievementSound();
      showAchievementToast(id);
    }
    return true;
  }

  // Shows any achievement toasts that were queued during a round-end
  // celebration, once that celebration has finished or been skipped.
  function flushQueuedAchievementToasts() {
    if (!state.queuedAchievementToasts.length) return;
    const ids = state.queuedAchievementToasts;
    state.queuedAchievementToasts = [];
    playAchievementSound();
    let delay = 0;
    ids.forEach((id) => {
      setTimeout(() => showAchievementToast(id), delay);
      delay += 250;
    });
  }

  function evaluateRoundAchievements() {
    const score = state.results.filter(r => r.correct).length;
    const total = state.results.length;
    unlockAchievement('firstRound');
    if (total > 0 && score === total) unlockAchievement('perfectRound');
    if (state.questions.length >= 50) unlockAchievement('bigRound');
    if (state.progress.settings.roundLength === 'all') unlockAchievement('allWords');
  }

  function launchConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const container = document.createElement('div');
    container.className = 'confetti-container';
    document.body.appendChild(container);
    const colors = ['#FFC163', '#FF4D6D', '#2DD4BF', '#C9A8FF'];
    const count = 44;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.35) + 's';
      piece.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
      piece.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      container.appendChild(piece);
    }
    setTimeout(() => { container.remove(); }, 3500);
  }

  function extractPairsFromRows(rows, skipHeader) {
    const startIdx = skipHeader ? 1 : 0;
    const cleaned = [];
    const seenEs = new Set();
    const dupes = [];
    const unknownCats = new Set();
    const badSentences = [];
    let skipped = 0;
    for (let i = startIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      const es = (row[0] ?? '').toString().trim();
      const en = (row[1] ?? '').toString().trim();
      const note = (row[2] ?? '').toString().trim();
      const category = (row[3] ?? '').toString().trim();
      const sentence = (row[4] ?? '').toString().trim();
      if (!es && !en) continue; // fully blank row - not worth flagging
      if (!es || !en) { skipped++; continue; }
      const esKey = es.toLowerCase();
      if (seenEs.has(esKey)) dupes.push(es);
      seenEs.add(esKey);
      if (category) {
        category.split(',').map(c => c.trim()).filter(Boolean).forEach(tag => {
          if (tag !== 'conjugation' && !CATEGORIES.some(c => c.id === tag)) unknownCats.add(tag);
        });
      }
      const pair = { es, en, note, category, sentence };
      if (sentence && !findClozeBlank(pair)) {
        // A sentence that doesn't actually contain its own target word
        // (typo, wrong row, edited word without updating the sentence)
        // would either break rendering or silently reveal nothing to
        // blank - drop it rather than risk either, this word just isn't
        // cloze-eligible until the sheet is fixed.
        badSentences.push(es);
        pair.sentence = '';
      }
      cleaned.push(pair);
    }
    if (skipped > 0) console.warn(`Palabra: skipped ${skipped} row(s) with only one of Spanish/English filled in.`);
    if (dupes.length > 0) console.warn(`Palabra: duplicate Spanish word(s) in the sheet: ${dupes.join(', ')}`);
    if (unknownCats.size > 0) console.warn(`Palabra: unrecognized category tag(s): ${[...unknownCats].join(', ')}`);
    if (badSentences.length > 0) console.warn(`Palabra: sentence doesn't contain its own word, cloze disabled for: ${badSentences.join(', ')}`);
    return cleaned;
  }

  // A pair's Category cell can hold several comma-separated tags (e.g.
  // "conjugation,dailyverbs"). These two helpers are the single place that
  // knows how to read that.
  function pairCategories(pair) {
    return pair.category ? pair.category.split(',').map(c => c.trim()).filter(Boolean) : [];
  }

  function pairHasCategory(pair, categoryId) {
    return pairCategories(pair).includes(categoryId);
  }

  // A word stays out of normal Quiz/Time Attack/Stream/Daily Double
  // practice only if "conjugation" is its *only* tag - a word tagged both
  // conjugation and a normal category (several dailyverbs entries are
  // both) still shows up in ordinary practice via that other tag.
  function isMainPoolEligible(pair) {
    const cats = pairCategories(pair);
    if (cats.length === 0) return true;
    return cats.some(c => c !== 'conjugation');
  }

  function parseRows(rows, skipHeader) {
    const cleaned = extractPairsFromRows(rows, skipHeader);
    if (cleaned.length === 0) {
      state.error = 'No word pairs found. Make sure column A has Spanish and column B has English.';
      state.pairs = [];
      state.mainPool = [];
      state.verbPairs = [];
      state.verbsLoaded = false;
      state.verbsError = '';
    } else {
      state.error = '';
      state.pairs = cleaned;
      state.mainPool = cleaned.filter(isMainPoolEligible);
      state.verbPairs = cleaned.filter(p => pairHasCategory(p, 'conjugation'));
      state.verbsLoaded = state.verbPairs.length > 0;
      state.verbsError = state.verbPairs.length === 0
        ? 'No verbs found. Make sure some rows in words.xlsx have "conjugation" in the Category column.'
        : '';
      state.verbsLoading = false;
    }
    render();
  }

  // Auto-load the word list from the repo on page load
  async function loadFromRepo() {
    state.loading = true;
    state.fetchFailed = false;
    render();
    try {
      const resp = await fetch(WORDS_FILE);
      if (!resp.ok) throw new Error('File not found: ' + resp.status);
      const buf = await resp.arrayBuffer();
      const data = new Uint8Array(buf);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      state.rawRows = rows;
      state.fileName = WORDS_FILE;
      state.loading = false;
      parseRows(rows, state.hasHeader);
      hidePalabraLoader();
    } catch (err) {
      state.loading = false;
      state.fetchFailed = true;
      state.showUpload = true;
      state.error = "Couldn't load \"" + WORDS_FILE + "\" automatically. If you're opening this file directly on your computer rather than through GitHub Pages or a local server, browsers block that kind of file access — try uploading it manually below, or view the page via its GitHub Pages URL instead.";
      render();
      hidePalabraLoader();
    }
  }

  // Fades out and removes the boot-time orb loader once the app has
  // reached an interactive state (word list loaded, or fallen back
  // to the manual-upload screen). Waits out APP_LOADING_MIN_MS first
  // so a fast load doesn't skip the animation entirely.
  function hidePalabraLoader() {
    const elapsed = Date.now() - appLoadingShownAt;
    const wait = Math.max(0, APP_LOADING_MIN_MS - elapsed);
    setTimeout(() => {
      const el = document.getElementById('app-loading');
      if (!el) return;
      el.classList.add('fade-out');
      setTimeout(() => el.remove(), 400);
    }, wait);
  }

  function handleFile(file) {
    if (!file) return;
    state.error = '';
    state.fileName = file.name;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        state.rawRows = rows;
        parseRows(rows, state.hasHeader);
      } catch (err) {
        state.error = "Couldn't read that file. Make sure it's a valid .xlsx or .xls file.";
        state.pairs = [];
        render();
      }
    };
    reader.onerror = () => { state.error = "Couldn't read that file."; render(); };
    reader.readAsArrayBuffer(file);
  }

  function clearAutoAdvanceTimer() {
    if (state.autoAdvanceTimer) {
      clearTimeout(state.autoAdvanceTimer);
      state.autoAdvanceTimer = null;
    }
  }

  function clearCelebrateTimer() {
    if (state.celebrateTimer) {
      clearTimeout(state.celebrateTimer);
      state.celebrateTimer = null;
    }
  }

  // Shows the round-end celebration screen, then automatically continues
  // to nextScreen after a short hold (or immediately on tap — see the
  // click listener in renderCelebrate).
  function showCelebration(variant, nextScreen) {
    clearCelebrateTimer();
    state.celebrateVariant = variant;
    state.celebrateNext = nextScreen;
    state.screen = 'celebrate';
    render();
    pingActivity();
    const hold = variant === 'perfect' ? 2700 : 2200;
    state.celebrateTimer = setTimeout(advanceFromCelebration, hold);
  }

  function advanceFromCelebration() {
    clearCelebrateTimer();
    const next = state.celebrateNext;
    state.celebrateNext = null;
    state.celebrateVariant = null;
    state.screen = next;
    render();
    flushQueuedAchievementToasts();
  }

  // Every 10 Stream questions: a soft checkpoint, not a hard stop. Reuses
  // the celebrate visuals but offers a real choice instead of a single
  // tap-anywhere-to-continue, since "keep going" and "stop" lead somewhere
  // genuinely different here (stopping shows results; continuing doesn't).
  function showStreamCheckpoint() {
    clearCelebrateTimer();

    const recentResults = state.results.slice(state.results.length - STREAM_CHECKPOINT_SIZE);
    const perfectBlock = recentResults.length === STREAM_CHECKPOINT_SIZE && recentResults.every(r => r.correct);
    state.progress.streamLifetime.checkpointsCompleted += 1;
    state.streamSessionCheckpoints += 1;
    if (state.progress.streamLifetime.checkpointsCompleted === 1) unlockAchievement('streamFirst');
    if (state.progress.streamLifetime.checkpointsCompleted >= 10) unlockAchievement('streamCheckpoints10');
    if (state.progress.streamLifetime.checkpointsCompleted >= 50) unlockAchievement('streamCheckpoints50');
    if (perfectBlock) unlockAchievement('streamPerfectCheckpoint');
    if (state.streamSessionCheckpoints >= 5) unlockAchievement('streamMarathon');
    saveProgress();

    state.screen = 'stream-checkpoint';
    render();
    pingActivity();
    // Longer than a normal round-end Celebrate hold (2200ms) on purpose —
    // there's a real decision here (keep going or stop), not just a
    // glance, so it needs actual reading + deciding time.
    state.celebrateTimer = setTimeout(continueStream, 4500);
  }

  function continueStream() {
    clearCelebrateTimer();
    state.streamCheckpointCount = 0;
    state.index += 1;
    state.input = '';
    state.checked = false;
    prepareQuestion();
    state.screen = 'quiz';
    render();
  }

  function stopStream() {
    clearCelebrateTimer();
    const score = state.results.filter(r => r.correct).length;
    const total = state.results.length;
    const perfect = total > 0 && score === total;
    state.lastRoundWasStream = true;
    state.isStreamRound = false;
    suppressAchievementFX = true;
    evaluateRoundAchievements();
    suppressAchievementFX = false;
    showCelebration(perfect ? 'perfect' : 'finished', 'result');
  }

  function prepareQuestion() {
    clearAutoAdvanceTimer();
    state.selectedOption = null;
    state.lastWasTypo = false;
    const current = state.questions[state.index];
    // Stream decides choice-vs-type per question (current.format); every
    // other mode still uses the single round-level answerMode setting.
    const useChoiceMode = state.isStreamRound
      ? (current && current.format !== 'type' && current.format !== 'cloze')
      : (state.effectiveAnswerMode === 'choice');
    if (useChoiceMode && current) {
      const targetField = current.direction === 'es-en' ? current.en : current.es;
      const correctText = splitAnswers(targetField)[0];
      const distractors = getDistractors(current, correctText, 2);
      state.currentOptions = distractors.length >= 2 ? shuffle([correctText, ...distractors]) : null;
    } else {
      state.currentOptions = null;
    }
  }

  function startQuiz() {
    const settings = state.progress.settings;
    const pool = activePairs();
    const roundLen = settings.roundLength === 'all' ? pool.length : parseInt(settings.roundLength, 10);
    state.questions = buildRound(pool, roundLen, settings.direction);
    state.index = 0;
    state.results = [];
    state.input = '';
    state.checked = false;
    state.newBestThisRound = false;
    state.lastFlippedIndex = -1;
    state.resultMode = 'round';
    state.lastRoundWasStream = false;
    state.lastRoundWasSentences = false;
    state.effectiveAnswerMode = (settings.answerMode === 'choice' && pool.length >= 3) ? 'choice' : 'type';
    prepareQuestion();
    state.screen = 'quiz';
    render();
  }

  // Sentences mode - every question is cloze, drawn only from words that
  // have a sentence (see sentencePairs()). Reuses the exact same round
  // engine, renderer, submit/record/next-question flow, and results screen
  // as Quiz - direction and answerMode settings don't apply to cloze (see
  // targetFieldFor / renderQuiz), so this mode has neither. Round length is
  // the one setting it does share with every other mode.
  function startSentences() {
    const settings = state.progress.settings;
    const pool = sentencePairs();
    const roundLen = settings.roundLength === 'all' ? pool.length : Math.min(parseInt(settings.roundLength, 10), pool.length);
    state.questions = buildRound(pool, roundLen, 'es-en').map(q => ({ ...q, format: 'cloze' }));
    state.index = 0;
    state.results = [];
    state.input = '';
    state.checked = false;
    state.newBestThisRound = false;
    state.lastFlippedIndex = -1;
    state.resultMode = 'round';
    state.lastRoundWasStream = false;
    state.lastRoundWasSentences = true;
    state.activeCategory = null; // Sentences draws from the whole word list, never a category
    state.effectiveAnswerMode = 'type'; // cloze is always typed, never multiple choice
    prepareQuestion();
    state.screen = 'quiz';
    render();
  }

  function backToSentencesSetup() {
    state.screen = 'sentences-setup';
    render();
  }

  function recordAnswer(current, correct, userAnswerDisplay) {
    const targetField = targetFieldFor(current);
    state.wasCorrect = correct;
    state.checked = true;
    state.results.push({
      prompt: current.format === 'cloze' ? primaryText(current.es) : primaryText(current.direction === 'es-en' ? current.es : current.en),
      correctAnswer: primaryText(targetField),
      userAnswer: userAnswerDisplay,
      correct,
    });

    const key = wordKey(current);
    if (!state.progress.wordStats[key]) {
      state.progress.wordStats[key] = { box: 0, nextDue: 0, right: 0, wrong: 0, lastSeen: 0 };
    }
    const ws = state.progress.wordStats[key];
    const now = Date.now();
    ws.lastSeen = now;
    ws.es = primaryText(current.es);
    ws.en = primaryText(current.en);
    if (correct) {
      ws.right += 1;
      ws.box = Math.min((ws.box || 0) + 1, SRS_INTERVALS_DAYS.length - 1);
      ws.nextDue = now + SRS_INTERVALS_DAYS[ws.box] * 86400000;
      // Permanent flag: true the first time this word ever reaches box 6,
      // and never cleared again — even if the word later gets a wrong
      // answer and drops back down. masteredWordsCount must only ever go
      // up, or the achievement would feel like it's regressing through no
      // fault of the person playing.
      if (ws.box === SRS_INTERVALS_DAYS.length - 1 && !ws.masteredEver) {
        ws.masteredEver = true;
        state.progress.masteredWordsCount = (state.progress.masteredWordsCount || 0) + 1;
        if (state.progress.masteredWordsCount >= 25) unlockAchievement('masteredWords25');
        if (state.progress.masteredWordsCount >= 100) unlockAchievement('masteredWords100');
      }
      state.progress.streak.current += 1;
      if (state.progress.streak.current > state.progress.streak.best) {
        state.progress.streak.best = state.progress.streak.current;
        state.newBestThisRound = true;
      }
    } else {
      ws.wrong += 1;
      ws.box = 0;
      ws.nextDue = now; // due again straight away
      state.progress.streak.current = 0;
    }
    state.progress.lifetime.totalAnswered += 1;
    if (correct) state.progress.lifetime.totalCorrect += 1;
    saveProgress();

    if (correct) playCorrectSound(); else playWrongSound();
    if (state.progress.streak.current >= 10) unlockAchievement('streak10');
    if (state.progress.streak.current >= 25) unlockAchievement('streak25');
    if (state.progress.lifetime.totalCorrect >= 50) unlockAchievement('correct50');
    if (state.progress.lifetime.totalCorrect >= 200) unlockAchievement('correct200');

    // Stream-specific tracking. Kept separate from the shared counters
    // above (lifetime/streak) since those already blend across every mode
    // that calls recordAnswer — these need to be genuinely Stream-only to
    // mean what their achievements claim.
    if (state.isStreamRound) {
      state.progress.streamLifetime.totalAnswered += 1;
      if (correct) {
        state.progress.streamLifetime.totalCorrect += 1;
        state.streamSessionStreak += 1;
        if (current.format) state.streamFormatsCorrect[current.format] = true;
        if (current.format === 'audio') state.progress.streamLifetime.audioCorrect += 1;
      } else {
        state.streamSessionStreak = 0;
      }
      if (state.progress.streamLifetime.totalCorrect >= 100) unlockAchievement('streamCorrect100');
      if (state.progress.streamLifetime.totalCorrect >= 500) unlockAchievement('streamCorrect500');
      if (state.progress.streamLifetime.audioCorrect >= 25) unlockAchievement('streamAudio25');
      if (state.streamSessionStreak >= 40) unlockAchievement('streamStreak40');
      if (state.streamFormatsCorrect.mc && state.streamFormatsCorrect.audio && state.streamFormatsCorrect.type) {
        unlockAchievement('streamAllFormats');
      }
      if (state.streamFormatsCorrect.mc && state.streamFormatsCorrect.audio && state.streamFormatsCorrect.type && state.streamFormatsCorrect.cloze) {
        unlockAchievement('streamAllFormatsQuad');
      }
      saveProgress();
    }
  }

  function submitAnswer() {
    const current = state.questions[state.index];
    if (!current || state.checked) return;
    const targetField = targetFieldFor(current);
    const userNorm = normalize(state.input);
    const acceptable = splitAnswers(targetField).map(normalize);
    let correct = false;
    let wasTypo = false;
    if (userNorm.length > 0) {
      if (acceptable.includes(userNorm)) {
        correct = true;
      } else if (acceptable.some(ans => isCloseMatch(userNorm, ans))) {
        correct = true;
        wasTypo = true;
      }
    }
    state.lastWasTypo = wasTypo;
    recordAnswer(current, correct, state.input);
    render();
    // A forgiven typo has a full sentence plus the correct spelling to
    // read (see the near-miss feedback in renderQuiz) — a plain correct
    // answer's 750ms is too quick for that, but it's not as much to
    // absorb as a wrong answer's full "correct answer: X" breakdown either.
    const delay = !correct ? 3000 : (wasTypo ? 1800 : 750);
    state.autoAdvanceTimer = setTimeout(() => { nextQuestion(); }, delay);
  }

  function selectOption(optionText) {
    const current = state.questions[state.index];
    if (!current || state.checked) return;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const acceptable = splitAnswers(targetField).map(normalize);
    const correct = acceptable.includes(normalize(optionText));
    state.selectedOption = optionText;
    recordAnswer(current, correct, optionText);
    render();
    const delay = correct ? 750 : 3000;
    state.autoAdvanceTimer = setTimeout(() => { nextQuestion(); }, delay);
  }

  function nextQuestion() {
    clearAutoAdvanceTimer();
    if (state.isStreamRound) {
      state.streamCheckpointCount += 1;
      // Keep the batch topped up well before it runs out, so it never
      // visibly "ends" — buildStreamBatch samples with replacement, so
      // this works regardless of how long the session has run.
      if (state.questions.length - (state.index + 1) < 5) {
        const lastKey = wordKey(state.questions[state.questions.length - 1]);
        state.questions = state.questions.concat(
          buildStreamBatch(activePairs(), 20, lastKey, state.questions.length)
        );
      }
      if (state.streamCheckpointCount >= STREAM_CHECKPOINT_SIZE) {
        showStreamCheckpoint();
        return;
      }
      state.index += 1;
      state.input = '';
      state.checked = false;
      prepareQuestion();
      render();
      return;
    }
    if (state.index + 1 >= state.questions.length) {
      const score = state.results.filter(r => r.correct).length;
      const total = state.results.length;
      const perfect = total > 0 && score === total;
      if (state.isDailyDoubleRound) {
        // Double XP: the round already earned its normal XP one correct
        // answer at a time via recordAnswer(), same as any other quiz.
        // This just matches that with one more top-up of the same size —
        // no per-answer special-casing needed.
        state.progress.dailyDoubleBonusXP = (state.progress.dailyDoubleBonusXP || 0) + score * XP_PER_QUIZ_CORRECT;
        state.isDailyDoubleRound = false;
        saveProgress();
      }
      suppressAchievementFX = true;
      evaluateRoundAchievements();
      suppressAchievementFX = false;
      showCelebration(perfect ? 'perfect' : 'finished', 'result');
      return;
    }
    state.index += 1;
    state.input = '';
    state.checked = false;
    prepareQuestion();
    render();
  }

  function goHome() {
    state.activeCategory = null;
    state.screen = 'start';
    render();
  }

  function clearLevelUpTimer() {
    if (state.levelUpTimer) {
      clearTimeout(state.levelUpTimer);
      state.levelUpTimer = null;
    }
  }

  // Every button that leaves a results screen (Home, Play again, Change
  // settings — all four games) routes through here instead of calling its
  // destination directly. If a level-up happened during that round, the
  // Level Up screen takes over first and the original destination is
  // deferred until it's dismissed (see advanceFromLevelUp below) — so the
  // celebration can never be missed regardless of which button was tapped.
  // Auto-advances after a short hold, same tap-to-skip-early pattern as
  // the round-end Celebrate screen.
  function leaveResults(destinationFn) {
    if (state.pendingLevelUp) {
      state.levelUpNextFn = destinationFn;
      state.pendingLevelUp = null;
      state.screen = 'level-up';
      render();
      pingActivity();
      clearLevelUpTimer();
      state.levelUpTimer = setTimeout(advanceFromLevelUp, 3200);
    } else {
      destinationFn();
    }
  }

  function advanceFromLevelUp() {
    clearLevelUpTimer();
    const fn = state.levelUpNextFn;
    state.levelUpNextFn = null;
    if (fn) fn(); else goHome();
  }

  function backToQuizSetup() {
    state.screen = state.activeCategory ? 'category-setup' : 'quiz-setup';
    render();
  }

  function backToTimeAttackSetup() {
    state.screen = 'timeattack-setup';
    render();
  }

  function goToCategories() {
    state.activeCategory = null;
    state.screen = 'categories';
    render();
  }

  function loadCategoryFile(categoryId) {
    state.activeCategory = categoryId;
    state.categoryLoading = false;
    // A 50-word round doesn't make sense for a themed category list -
    // fall back to a sane default rather than cycling through it repeatedly.
    if (state.progress.settings.roundLength === '50') {
      state.progress.settings.roundLength = '20';
      saveProgress();
    }
    const filtered = state.pairs.filter(p => pairHasCategory(p, categoryId));
    if (filtered.length === 0) {
      state.categoryError = 'No words tagged "' + categoryId + '" found. Check the Category column in words.xlsx.';
      state.categoryPairs = [];
    } else {
      state.categoryError = '';
      state.categoryPairs = filtered;
    }
    state.screen = 'category-setup';
    render();
  }

  function quitQuiz() {
    const msg = state.isStreamRound
      ? 'Stop here? Your progress so far will be saved.'
      : 'Quit this round? Your progress on it will be scored as-is.';
    if (!confirm(msg)) return;
    clearAutoAdvanceTimer();
    state.lastRoundWasStream = state.isStreamRound;
    state.isStreamRound = false;
    state.screen = 'result';
    evaluateRoundAchievements();
    render();
  }

  function clearTaTimerInterval() {
    if (state.taTimerHandle) {
      clearInterval(state.taTimerHandle);
      state.taTimerHandle = null;
    }
  }

  function clearTaFlashTimer() {
    if (state.taFlashTimer) {
      clearTimeout(state.taFlashTimer);
      state.taFlashTimer = null;
    }
  }

  function checkTimeAttackAchievements() {
    if (state.taScore >= 10) unlockAchievement('timeAttack10');
    if (state.taScore >= 25) unlockAchievement('timeAttack25');
    if (state.taScore >= 50) unlockAchievement('timeAttack50');
    if (state.taScore >= 100) unlockAchievement('timeAttack100');
    if (state.taStreak >= 15) unlockAchievement('timeAttackStreak15');
    if (state.taStreak >= 30) unlockAchievement('timeAttackStreak30');
    if (state.progress.taLifetime.totalCorrect >= 100) unlockAchievement('timeAttackCorrect100');
    if (state.progress.taLifetime.totalCorrect >= 500) unlockAchievement('timeAttackCorrect500');
  }

  function loadNextTimeAttackQuestion() {
    const settings = state.progress.settings;
    const prevKey = state.taCurrentQuestion ? wordKey(state.taCurrentQuestion) : null;
    const picked = weightedPickOne(state.mainPool, getWeight, prevKey);
    const direction = settings.direction === 'mixed' ? (Math.random() < 0.5 ? 'es-en' : 'en-es') : settings.direction;
    const current = { ...picked, direction };
    state.taCurrentQuestion = current;
    state.taSelectedOption = null;
    state.taInput = '';
    if (state.effectiveAnswerMode === 'choice') {
      const targetField = direction === 'es-en' ? current.en : current.es;
      const correctText = splitAnswers(targetField)[0];
      const distractors = getDistractors(current, correctText, 2);
      state.taCurrentOptions = distractors.length >= 2 ? shuffle([correctText, ...distractors]) : null;
    } else {
      state.taCurrentOptions = null;
    }
  }

  function startTimeAttack() {
    if (state.mainPool.length === 0) return;
    const settings = state.progress.settings;
    state.results = [];
    state.taScore = 0;
    state.taStreak = 0;
    state.taActive = true;
    state.taIsNewBest = false;
    state.taEndTime = Date.now() + 60000;
    state.taTimeLeft = 60;
    state.resultMode = 'timeattack';
    state.effectiveAnswerMode = (settings.answerMode === 'choice' && state.mainPool.length >= 3) ? 'choice' : 'type';
    loadNextTimeAttackQuestion();
    state.screen = 'timeattack';
    render();
    clearTaTimerInterval();
    state.taTimerHandle = setInterval(tickTimeAttack, 250);
  }

  function tickTimeAttack() {
    if (!state.taActive) return;
    const remainingMs = Math.max(0, state.taEndTime - Date.now());
    state.taTimeLeft = Math.ceil(remainingMs / 1000);
    const timerLabel = document.getElementById('ta-timer');
    if (timerLabel) timerLabel.textContent = state.taTimeLeft + 's';
    const fill = document.getElementById('ta-timer-fill');
    if (fill) fill.style.width = (remainingMs / 60000 * 100) + '%';
    if (remainingMs <= 0) {
      endTimeAttack();
    }
  }

  function taSubmit(correct, displayValue) {
    if (!state.taActive) return;
    const current = state.taCurrentQuestion;
    // Update before recordAnswer() so its saveProgress() call persists
    // these alongside everything else in one write, rather than needing
    // a second save here.
    state.progress.taLifetime.totalAnswered += 1;
    if (correct) state.progress.taLifetime.totalCorrect += 1;
    recordAnswer(current, correct, displayValue);
    if (correct) {
      state.taScore++;
      state.taStreak++;
      checkTimeAttackAchievements();
    } else {
      state.taStreak = 0;
    }
    const scoreEl = document.getElementById('ta-score');
    if (scoreEl) scoreEl.textContent = state.taScore;
    const promptEl = document.getElementById('ta-prompt-card');
    if (promptEl) promptEl.classList.add(correct ? 'flash-correct' : 'flash-wrong');

    clearTaFlashTimer();
    const delay = correct ? 220 : 420;
    state.taFlashTimer = setTimeout(() => {
      if (!state.taActive) return;
      loadNextTimeAttackQuestion();
      render();
    }, delay);
  }

  function handleTaTypedSubmit() {
    if (!state.taActive) return;
    const current = state.taCurrentQuestion;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const correct = isAnswerCorrect(state.taInput, targetField);
    taSubmit(correct, state.taInput);
  }

  function taSelectOption(optionText) {
    if (!state.taActive) return;
    const current = state.taCurrentQuestion;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const acceptable = splitAnswers(targetField).map(normalize);
    const correct = acceptable.includes(normalize(optionText));
    taSubmit(correct, optionText);
  }

  function endTimeAttack() {
    if (!state.taActive) return;
    state.taActive = false;
    clearTaTimerInterval();
    clearTaFlashTimer();
    const prevBest = state.progress.timeAttackBest || 0;
    const isNewBest = state.taScore > prevBest;
    if (isNewBest) {
      state.progress.timeAttackBest = state.taScore;
    }
    saveProgress();
    state.taIsNewBest = isNewBest;
    state.resultMode = 'timeattack';
    // Perfect here means no wrong answers in the round, however many were
    // answered in the time — same score === total definition as the other
    // modes, just without a fixed round length.
    const score = state.results.filter(r => r.correct).length;
    const total = state.results.length;
    const perfect = total > 0 && score === total;
    suppressAchievementFX = true;
    // Same "not first-ever" guard as Memory Match's perfect redefinition —
    // prevBest > 0 means there was an actual previous best to beat.
    if (isNewBest && prevBest > 0) unlockAchievement('timeAttackNewBest');
    if (perfect) unlockAchievement('timeAttackFlawless');
    suppressAchievementFX = false;
    showCelebration(perfect ? 'perfect' : 'finished', 'result');
  }

  function quitTimeAttack() {
    if (!confirm('Quit this round? Your progress on it will be scored as-is.')) return;
    endTimeAttack();
  }

  function backToMemorySetup() {
    state.screen = 'memory-setup';
    render();
  }

  function clearMemoryTimerInterval() {
    if (state.memoryTimerHandle) {
      clearInterval(state.memoryTimerHandle);
      state.memoryTimerHandle = null;
    }
  }

  function clearMemoryFlipTimer() {
    if (state.memoryFlipTimer) {
      clearTimeout(state.memoryFlipTimer);
      state.memoryFlipTimer = null;
    }
  }

  function formatMemoryTime(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // A found match still nudges the word forward in the same spaced-repetition
  // schedule as a correct Quiz answer. It deliberately does NOT touch the shared
  // answer streak or lifetime totals - a memory slip isn't the same as a wrong
  // translation, and an easily-farmed match shouldn't inflate the streak that
  // Quiz/Time Attack achievements are built on.
  function recordMemoryMatch(pair) {
    const key = wordKey(pair);
    if (!state.progress.wordStats[key]) {
      state.progress.wordStats[key] = { box: 0, nextDue: 0, right: 0, wrong: 0, lastSeen: 0 };
    }
    const ws = state.progress.wordStats[key];
    const now = Date.now();
    ws.lastSeen = now;
    ws.es = primaryText(pair.es);
    ws.en = primaryText(pair.en);
    ws.right += 1;
    ws.box = Math.min((ws.box || 0) + 1, SRS_INTERVALS_DAYS.length - 1);
    ws.nextDue = now + SRS_INTERVALS_DAYS[ws.box] * 86400000;
  }

  function startMemoryMatch() {
    if (state.mainPool.length < 2) return;
    const gridSize = parseInt(state.progress.settings.memoryGridSize, 10);
    const pairCount = Math.min(gridSize, state.mainPool.length);
    const chosen = weightedSampleWithoutReplacement(state.mainPool, getWeight, pairCount);

    const tiles = [];
    chosen.forEach((pair, i) => {
      const esText = primaryText(pair.es);
      const enText = primaryText(pair.en);
      tiles.push({ pairIndex: i, lang: 'es', text: esText, matched: false, pair });
      tiles.push({ pairIndex: i, lang: 'en', text: enText, matched: false, pair });
    });

    state.memoryTiles = shuffle(tiles);
    state.memoryFlipped = [];
    state.memoryMatchedCount = 0;
    state.memoryTotalPairs = pairCount;
    state.memoryMoves = 0;
    state.memoryBusy = false;
    state.memoryStartTime = Date.now();
    state.memorySeconds = 0;
    state.memoryIsNewBest = false;
    state.memoryJustFlipped = [];
    state.memoryReacting = [];

    state.screen = 'memory-play';
    render();

    clearMemoryTimerInterval();
    state.memoryTimerHandle = setInterval(tickMemoryTimer, 1000);
  }

  function tickMemoryTimer() {
    state.memorySeconds = Math.floor((Date.now() - state.memoryStartTime) / 1000);
    const el = document.getElementById('memory-timer');
    if (el) el.textContent = formatMemoryTime(state.memorySeconds);
  }

  function flipMemoryTile(index) {
    if (state.memoryBusy) return;
    const tile = state.memoryTiles[index];
    if (!tile || tile.matched) return;
    if (state.memoryFlipped.includes(index)) return;
    if (state.memoryFlipped.length >= 2) return;

    state.memoryFlipped.push(index);

    if (state.memoryFlipped.length === 1) {
      state.memoryJustFlipped = [index];
      state.memoryReacting = [];
      render();
      return;
    }

    state.memoryMoves += 1;
    const [firstIdx, secondIdx] = state.memoryFlipped;
    const first = state.memoryTiles[firstIdx];
    const second = state.memoryTiles[secondIdx];

    if (first.pairIndex === second.pairIndex) {
      first.matched = true;
      second.matched = true;
      state.memoryMatchedCount += 1;
      recordMemoryMatch(first.pair);
      saveProgress();
      state.memoryFlipped = [];
      state.memoryJustFlipped = [secondIdx];
      state.memoryReacting = [firstIdx, secondIdx];
      playCorrectSound();
      render();

      if (state.memoryMatchedCount >= state.memoryTotalPairs) {
        clearMemoryTimerInterval();
        setTimeout(() => { endMemoryMatch(); }, 1200);
      }
    } else {
      state.memoryBusy = true;
      state.memoryJustFlipped = [secondIdx];
      state.memoryReacting = [firstIdx, secondIdx];
      playWrongSound();
      render();
      clearMemoryFlipTimer();
      state.memoryFlipTimer = setTimeout(() => {
        state.memoryFlipped = [];
        state.memoryBusy = false;
        state.memoryJustFlipped = [firstIdx, secondIdx];
        render();
      }, 1500);
    }
  }

  function endMemoryMatch() {
    clearMemoryTimerInterval();
    clearMemoryFlipTimer();
    const gridSize = state.progress.settings.memoryGridSize;
    const prevBest = state.progress.memoryBest[gridSize];
    const isNewBest = !prevBest || state.memoryMoves < prevBest;
    if (isNewBest) {
      state.progress.memoryBest[gridSize] = state.memoryMoves;
    }
    state.progress.memoryLifetime.boardsCleared += 1;
    if (state.progress.memoryLifetime.bySize[gridSize] === undefined) {
      state.progress.memoryLifetime.bySize[gridSize] = 0;
    }
    state.progress.memoryLifetime.bySize[gridSize] += 1;
    state.progress.memoryClearedSizes[gridSize] = true;
    saveProgress();
    state.memoryIsNewBest = isNewBest;

    // "Perfect" used to mean zero mismatches, which is essentially a fluke
    // on anything but the smallest board. It now means a genuine new best
    // for this grid size — and only counts if there was a previous best to
    // beat, so a first-ever play on a grid size (which is always
    // technically "new best") never triggers it.
    const perfect = isNewBest && !!prevBest;
    const allSizesCleared = ['6', '8', '12'].every(size => state.progress.memoryClearedSizes[size]);
    suppressAchievementFX = true;
    unlockAchievement('memoryFirstWin');
    if (perfect) unlockAchievement('memoryPerfect');
    if (state.memoryTotalPairs === 6 && state.memorySeconds < 30) unlockAchievement('memoryFast6');
    if (state.memoryTotalPairs === 8 && state.memorySeconds < 50) unlockAchievement('memoryFast8');
    if (state.memoryTotalPairs === 12 && state.memorySeconds < 90) unlockAchievement('memoryFast');
    if (state.progress.memoryLifetime.boardsCleared >= 10) unlockAchievement('memoryBoards10');
    if (state.progress.memoryLifetime.boardsCleared >= 50) unlockAchievement('memoryBoards50');
    if (allSizesCleared) unlockAchievement('memoryAllSizes');
    suppressAchievementFX = false;

    showCelebration(perfect ? 'perfect' : 'finished', 'memory-result');
  }

  function quitMemoryMatch() {
    if (!confirm('Quit this board? Your progress on it will be lost.')) return;
    clearMemoryTimerInterval();
    clearMemoryFlipTimer();
    goHome();
  }

  function verbComboKey(pair, personIndex) {
    return normalize(pair.es) + '::' + personIndex;
  }

  function getVerbComboWeight(combo) {
    const stats = state.progress.verbStats[verbComboKey(combo.pair, combo.person)];
    const now = Date.now();
    if (!stats) return 12;
    const overdueMs = now - (stats.nextDue || 0);
    if (overdueMs >= 0) {
      const overdueDays = overdueMs / 86400000;
      return 6 + Math.min(overdueDays, 12) * 1.5;
    }
    const daysUntilDue = -overdueMs / 86400000;
    return Math.max(0.2, 3 / (1 + daysUntilDue * 2));
  }

  function buildVerbComboPool() {
    const pool = [];
    state.verbPairs.forEach(pair => {
      validPersonsFor(pair.es).forEach(p => pool.push({ pair, person: p }));
    });
    return pool;
  }

  function buildConjugateRound(length) {
    const pool = buildVerbComboPool();
    let selected = [];
    while (selected.length < length && pool.length > 0) {
      const remaining = length - selected.length;
      const batchSize = Math.min(remaining, pool.length);
      const batch = weightedSampleWithoutReplacement(pool, getVerbComboWeight, batchSize);
      selected = selected.concat(batch);
    }
    return selected;
  }

  function getConjugateDistractors(combo, correctText, count) {
    const otherPersons = shuffle([0, 1, 2, 3, 4, 5].filter(p => p !== combo.person));
    const seen = new Set([normalize(correctText)]);
    const candidates = [];
    otherPersons.forEach(p => {
      const form = conjugatePresent(combo.pair.es, p);
      if (!form) return;
      const n = normalize(form);
      if (seen.has(n)) return;
      seen.add(n);
      candidates.push(form);
    });
    return candidates.slice(0, count);
  }

  // Verbs now come from the same sheet as everything else (rows tagged
  // "conjugation" - see isMainPoolEligible/pairHasCategory), already
  // derived into state.verbPairs whenever the word list loads (parseRows).
  // This just re-derives from whatever's currently in state.pairs - kept
  // around as a synchronous fallback for goToConjugateSetup, in case it's
  // ever reached before the word list has loaded.
  function loadVerbsFile() {
    state.verbsLoading = false;
    state.verbPairs = state.pairs.filter(p => pairHasCategory(p, 'conjugation'));
    if (state.verbPairs.length === 0) {
      state.verbsError = 'No verbs found. Make sure some rows in words.xlsx have "conjugation" in the Category column.';
      state.verbsLoaded = false;
    } else {
      state.verbsError = '';
      state.verbsLoaded = true;
    }
    render();
  }

  function goToConjugateSetup() {
    state.screen = 'conjugate-setup';
    if (state.verbsLoaded) {
      render();
    } else {
      loadVerbsFile();
    }
  }

  function backToConjugateSetup() {
    state.screen = 'conjugate-setup';
    render();
  }

  function prepareConjugateQuestion() {
    clearAutoAdvanceTimer();
    state.conjugateSelectedOption = null;
    state.conjugateLastWasTypo = false;
    const combo = state.conjugateQuestions[state.conjugateIndex];
    if (state.progress.settings.answerMode === 'choice' && combo) {
      const correctText = conjugatePresent(combo.pair.es, combo.person);
      const distractors = getConjugateDistractors(combo, correctText, 2);
      state.conjugateCurrentOptions = distractors.length >= 2 ? shuffle([correctText, ...distractors]) : null;
    } else {
      state.conjugateCurrentOptions = null;
    }
  }

  function startConjugateRound() {
    const settings = state.progress.settings;
    const roundLen = settings.roundLength === 'all' ? state.verbPairs.length : parseInt(settings.roundLength, 10);
    state.conjugateQuestions = buildConjugateRound(roundLen);
    state.conjugateIndex = 0;
    state.conjugateResults = [];
    state.conjugateInput = '';
    state.conjugateChecked = false;
    state.conjugateNewBestStreak = false;
    state.lastFlippedIndex = -1;
    state.screen = 'conjugate';
    prepareConjugateQuestion();
    render();
  }

  function recordConjugateAnswer(combo, correct, userAnswerDisplay) {
    const correctText = conjugatePresent(combo.pair.es, combo.person);
    state.conjugateWasCorrect = correct;
    state.conjugateChecked = true;
    state.conjugateResults.push({
      prompt: combo.pair.es + ' (' + PERSON_LABELS[combo.person] + ')',
      correctAnswer: correctText,
      userAnswer: userAnswerDisplay,
      correct,
    });

    const key = verbComboKey(combo.pair, combo.person);
    if (!state.progress.verbStats[key]) {
      state.progress.verbStats[key] = { box: 0, nextDue: 0, right: 0, wrong: 0, lastSeen: 0 };
    }
    const vs = state.progress.verbStats[key];
    const now = Date.now();
    vs.lastSeen = now;
    vs.es = combo.pair.es;
    vs.en = combo.pair.en;
    vs.person = combo.person;
    if (correct) {
      vs.right += 1;
      vs.box = Math.min((vs.box || 0) + 1, SRS_INTERVALS_DAYS.length - 1);
      vs.nextDue = now + SRS_INTERVALS_DAYS[vs.box] * 86400000;
      state.progress.conjugateStreak.current += 1;
      if (state.progress.conjugateStreak.current > state.progress.conjugateStreak.best) {
        state.progress.conjugateStreak.best = state.progress.conjugateStreak.current;
        state.conjugateNewBestStreak = true;
      }
    } else {
      vs.wrong += 1;
      vs.box = 0;
      vs.nextDue = now;
      state.progress.conjugateStreak.current = 0;
    }
    state.progress.conjugateLifetime.totalAnswered += 1;
    if (correct) state.progress.conjugateLifetime.totalCorrect += 1;
    saveProgress();

    if (correct) playCorrectSound(); else playWrongSound();
    if (state.progress.conjugateStreak.current >= 5) unlockAchievement('conjugateStreak5');
    if (state.progress.conjugateStreak.current >= 15) unlockAchievement('conjugateStreak15');
    if (state.progress.conjugateStreak.current >= 30) unlockAchievement('conjugateStreak30');
    if (state.progress.conjugateStreak.current >= 50) unlockAchievement('conjugateStreak50');
    if (state.progress.conjugateLifetime.totalCorrect >= 50) unlockAchievement('conjugateCorrect50');
    if (state.progress.conjugateLifetime.totalCorrect >= 200) unlockAchievement('conjugateCorrect200');
  }

  function submitConjugateAnswer() {
    const combo = state.conjugateQuestions[state.conjugateIndex];
    if (!combo || state.conjugateChecked) return;
    const correctText = conjugatePresent(combo.pair.es, combo.person);
    const userNorm = normalize(state.conjugateInput);
    const correctNorm = normalize(correctText);
    let correct = false;
    let wasTypo = false;
    if (userNorm.length > 0) {
      if (userNorm === correctNorm) {
        correct = true;
      } else if (isCloseMatch(userNorm, correctNorm)) {
        correct = true;
        wasTypo = true;
      }
    }
    state.conjugateLastWasTypo = wasTypo;
    recordConjugateAnswer(combo, correct, state.conjugateInput);
    render();
  }

  function selectConjugateOption(optionText) {
    const combo = state.conjugateQuestions[state.conjugateIndex];
    if (!combo || state.conjugateChecked) return;
    const correctText = conjugatePresent(combo.pair.es, combo.person);
    const correct = normalize(optionText) === normalize(correctText);
    state.conjugateSelectedOption = optionText;
    recordConjugateAnswer(combo, correct, optionText);
    render();
    const delay = correct ? 750 : 3000;
    state.autoAdvanceTimer = setTimeout(() => { nextConjugateQuestion(); }, delay);
  }

  function evaluateConjugateRoundAchievements() {
    const score = state.conjugateResults.filter(r => r.correct).length;
    const total = state.conjugateResults.length;
    unlockAchievement('conjugateFirstRound');
    if (total > 0 && score === total) unlockAchievement('conjugatePerfect');
    if (state.conjugateQuestions.length >= 50) unlockAchievement('conjugateBigRound');
  }

  function nextConjugateQuestion() {
    clearAutoAdvanceTimer();
    if (state.conjugateIndex + 1 >= state.conjugateQuestions.length) {
      const score = state.conjugateResults.filter(r => r.correct).length;
      const total = state.conjugateResults.length;
      const perfect = total > 0 && score === total;
      suppressAchievementFX = true;
      evaluateConjugateRoundAchievements();
      suppressAchievementFX = false;
      showCelebration(perfect ? 'perfect' : 'finished', 'conjugate-result');
      return;
    }
    state.conjugateIndex += 1;
    state.conjugateInput = '';
    state.conjugateChecked = false;
    prepareConjugateQuestion();
    render();
  }

  function quitConjugateRound() {
    if (!confirm('Quit this round? Your progress on it will be scored as-is.')) return;
    clearAutoAdvanceTimer();
    state.screen = 'conjugate-result';
    evaluateConjugateRoundAchievements();
    render();
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---- My Progress helpers ----

  // Counts how many stats entries sit in each of the 6 SRS boxes. Works for
  // both wordStats and verbStats (same shape). Used for the box-distribution
  // bars on the My Progress screen.
  function boxCounts(statsObj) {
    const counts = [0, 0, 0, 0, 0, 0];
    Object.keys(statsObj).forEach(key => {
      const box = statsObj[key].box || 0;
      if (box >= 0 && box < counts.length) counts[box] += 1;
    });
    return counts;
  }

  // Lowest-box entries first (what you're weakest on right now), then
  // highest wrong-count as a tiebreaker, then least-recently-seen last.
  // Prefers stored display text, but falls back to matching against
  // whichever word list is currently loaded (state.pairs) for older entries
  // recorded before that field existed - so they show up immediately
  // instead of waiting to be answered again. Only entries matching neither
  // source (rare: a word from a list not currently loaded) are skipped -
  // they're still fully counted in boxCounts() above regardless.
  function lowestBoxWords(limit) {
    const fallback = {};
    state.pairs.forEach(pair => { fallback[wordKey(pair)] = pair; });

    const sorted = Object.entries(state.progress.wordStats)
      .sort((a, b) => (a[1].box - b[1].box) || (b[1].wrong - a[1].wrong) || (a[1].lastSeen - b[1].lastSeen));

    const out = [];
    for (const [key, ws] of sorted) {
      const fb = fallback[key];
      const es = ws.es || (fb && fb.es);
      const en = ws.en || (fb && fb.en);
      if (es && en) {
        out.push({ es, en, box: ws.box, wrong: ws.wrong });
        if (out.length >= limit) break;
      }
    }
    return out;
  }

  // --- Daily Double ---------------------------------------------------
  // Local device date, plain YYYY-MM-DD string — deliberately not a
  // timestamp, so it's a simple equality check rather than fiddly
  // midnight-boundary math. Stored on the synced progress object so a
  // Skip/Play decision follows the account across devices, same day.
  function todayDateString() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // The 10 words for a Daily Double round: your lowest-box words first
  // (combined Quiz + Categories history, same source as "Words to
  // review"), padded with random never-seen words if there aren't 10 yet.
  function buildDailyDoubleRound() {
    const selected = lowestBoxWords(10);
    const usedKeys = new Set(selected.map(w => wordKey(w)));

    if (selected.length < 10) {
      const neverSeen = shuffle(state.mainPool.filter(p => !state.progress.wordStats[wordKey(p)] && !usedKeys.has(wordKey(p))));
      for (const p of neverSeen) {
        if (selected.length >= 10) break;
        selected.push(p);
        usedKeys.add(wordKey(p));
      }
    }
    // Extreme edge case — a word list small enough that even never-seen
    // words run out. Top up with anything not already picked rather than
    // quietly running a shorter round.
    if (selected.length < 10) {
      const anyRemaining = shuffle(state.mainPool.filter(p => !usedKeys.has(wordKey(p))));
      for (const p of anyRemaining) {
        if (selected.length >= 10) break;
        selected.push(p);
        usedKeys.add(wordKey(p));
      }
    }

    return shuffle(selected).map(p => ({
      ...p,
      direction: Math.random() < 0.5 ? 'es-en' : 'en-es', // mixed, same as buildRound()
    }));
  }

  // Same idea for verb combos. The person index can always be recovered
  // from the stats key itself (normalize(es) + '::' + personIndex), so
  // only the display text needs the fallback.
  function lowestBoxVerbCombos(limit) {
    const fallbackByEs = {};
    state.verbPairs.forEach(pair => { fallbackByEs[normalize(pair.es)] = pair; });

    const sorted = Object.entries(state.progress.verbStats)
      .sort((a, b) => (a[1].box - b[1].box) || (b[1].wrong - a[1].wrong) || (a[1].lastSeen - b[1].lastSeen));

    const out = [];
    for (const [key, vs] of sorted) {
      const parts = key.split('::');
      const person = typeof vs.person === 'number' ? vs.person : parseInt(parts[1], 10);
      const fb = fallbackByEs[parts[0]];
      const es = vs.es || (fb && fb.es);
      const en = vs.en || (fb && fb.en) || '';
      if (es && !isNaN(person)) {
        out.push({ es, en, box: vs.box, wrong: vs.wrong, person });
        if (out.length >= limit) break;
      }
    }
    return out;
  }

  function renderConjugate() {
    const app = document.getElementById('app');
    const combo = state.conjugateQuestions[state.conjugateIndex];
    if (!combo) return;

    let tilesHtml = '';
    state.conjugateQuestions.forEach((_, i) => {
      let bg = 'var(--outline)';
      if (i < state.conjugateResults.length) bg = state.conjugateResults[i].correct ? COLORS.green : COLORS.red;
      else if (i === state.conjugateIndex) bg = COLORS.ochre;
      tilesHtml += `<div class="tile" style="background:${bg}"></div>`;
    });

    const promptWord = combo.pair.es;
    const personLabel = PERSON_LABELS[combo.person];
    const correctText = conjugatePresent(combo.pair.es, combo.person);
    const promptLang = 'es-ES';
    const verbTranslation = primaryText(combo.pair.en);

    const useChoice = state.progress.settings.answerMode === 'choice' && state.conjugateCurrentOptions;
    const shouldFlip = state.lastFlippedIndex !== state.conjugateIndex;
    if (shouldFlip) state.lastFlippedIndex = state.conjugateIndex;

    let bottomHtml;

    if (useChoice) {
      let optionsHtml = '<div class="option-list" id="options-container">';
      state.conjugateCurrentOptions.forEach((opt) => {
        let cls = 'option-btn';
        if (state.conjugateChecked) {
          const isCorrectOpt = normalize(opt) === normalize(correctText);
          if (isCorrectOpt) cls += ' correct-choice pop-anim';
          else if (opt === state.conjugateSelectedOption) cls += ' wrong-choice shake-anim';
        }
        optionsHtml += `<button class="${cls}" ${state.conjugateChecked ? 'disabled' : ''}>${esc(opt)}</button>`;
      });
      optionsHtml += '</div>';

      let feedbackHtml = '';
      if (state.conjugateChecked) {
        if (state.conjugateWasCorrect) {
          feedbackHtml = `<div class="feedback correct"><div class="title">✅ Correct</div></div>`;
        } else {
          feedbackHtml = `
            <div class="feedback wrong"><div class="title">❌ Not quite</div></div>
            <button id="next-btn" class="btn-primary">Next word</button>
            <div class="countdown-bar-track"><div class="countdown-bar-fill" id="countdown-fill"></div></div>
          `;
        }
      }
      bottomHtml = optionsHtml + feedbackHtml;
    } else if (!state.conjugateChecked) {
      bottomHtml = `
        <input id="answer-input" type="text" placeholder="Type the conjugated form…" value="${esc(state.conjugateInput)}" autocomplete="off" />
        <button id="check-btn" class="btn-primary">Check</button>
      `;
    } else {
      bottomHtml = `
        <div class="feedback ${state.conjugateWasCorrect ? 'correct' : 'wrong'}">
          <div class="title">${state.conjugateWasCorrect ? '✅ Correct' : '❌ Not quite'}</div>
          ${!state.conjugateWasCorrect ? `<div class="answer">Correct answer: <strong>${esc(correctText)}</strong> <button id="speak-answer-btn" class="speak-btn" title="Hear it" style="width:26px;height:26px;font-size:12px;">🔊</button></div>` : ''}
          ${state.conjugateWasCorrect && state.conjugateLastWasTypo ? `<div class="answer">✓ Close enough — small typo forgiven</div>` : ''}
        </div>
        <button id="next-btn" class="btn-primary">${state.conjugateIndex + 1 >= state.conjugateQuestions.length ? 'See results' : 'Next word'}</button>
      `;
    }

    app.innerHTML = `
      <div class="screen bg-conjugate">
        <div class="wrap">
          <div class="tiles" style="grid-template-columns: repeat(${Math.min(state.conjugateQuestions.length, 20)}, 1fr);">${tilesHtml}</div>
          <div class="progress-label">${state.conjugateIndex + 1} / ${state.conjugateQuestions.length}</div>
          <div class="prompt-card ${shouldFlip ? 'card-flip-in' : ''}">
            <div class="glow-orb-progress"><div class="orb-num">${state.conjugateIndex + 1}</div><div class="orb-lbl">OF ${state.conjugateQuestions.length}</div></div>
            <div class="eyebrow" style="margin-bottom:8px;">${esc(personLabel.toUpperCase())}</div>
            <div class="prompt-row">
              <div class="prompt-word">${esc(promptWord)}</div>
              <button id="speak-prompt-btn" class="speak-btn" title="Hear it">🔊</button>
            </div>
            <div class="prompt-translation">${esc(verbTranslation)}</div>
            ${combo.pair.note ? `<div class="prompt-note">${esc(combo.pair.note)}</div>` : ''}
          </div>
          ${bottomHtml}
          <button id="conjugate-quit-btn" class="quit-link" style="display:block; text-align:center; width:100%; margin-top:14px;">Quit</button>
        </div>
      </div>
    `;

    const speakPromptBtn = document.getElementById('speak-prompt-btn');
    speakPromptBtn.addEventListener('click', () => speak(promptWord, promptLang, speakPromptBtn));

    if (useChoice) {
      if (!state.conjugateChecked) {
        document.querySelectorAll('#options-container .option-btn').forEach((btn, i) => {
          btn.addEventListener('click', () => selectConjugateOption(state.conjugateCurrentOptions[i]));
        });
        if (state.progress.settings.autoSpeak) speak(promptWord, promptLang, speakPromptBtn);
      } else if (!state.conjugateWasCorrect) {
        document.getElementById('next-btn').addEventListener('click', nextConjugateQuestion);
        const fill = document.getElementById('countdown-fill');
        if (fill) {
          requestAnimationFrame(() => { requestAnimationFrame(() => { fill.style.width = '0%'; }); });
        }
      }
    } else if (!state.conjugateChecked) {
      const input = document.getElementById('answer-input');
      input.focus();
      input.addEventListener('input', (e) => { state.conjugateInput = e.target.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.stopPropagation();
          submitConjugateAnswer();
        }
      });
      document.getElementById('check-btn').addEventListener('click', submitConjugateAnswer);
      if (state.progress.settings.autoSpeak) speak(promptWord, promptLang, speakPromptBtn);
    } else {
      document.getElementById('next-btn').addEventListener('click', nextConjugateQuestion);
      const speakAnswerBtn = document.getElementById('speak-answer-btn');
      if (speakAnswerBtn) speakAnswerBtn.addEventListener('click', () => speak(correctText, promptLang, speakAnswerBtn));
    }

    document.getElementById('conjugate-quit-btn').addEventListener('click', quitConjugateRound);
  }
