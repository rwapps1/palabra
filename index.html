          </div>
          <div class="screen-body">
            <div class="eyebrow" style="margin-bottom:4px;">Resultado</div>
            <div class="score-big" style="margin-bottom:12px;">${score}/${total}</div>
            ${state.newBestThisRound ? `<div class="new-best">🔥 New best streak: ${streak.best}</div>` : ''}
            <div class="streak-line">Current streak: ${streak.current} &nbsp;·&nbsp; Best: ${streak.best}</div>
            <div class="mosaic">${mosaicHtml}</div>
            ${reviewHtml}
            <button id="again-btn" class="btn-primary" style="width:100%; margin-bottom:10px;">Play again</button>
            <button id="settings-btn" class="btn-secondary" style="width:100%;">Change settings</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('back-btn').addEventListener('click', goHome);
    document.getElementById('again-btn').addEventListener('click', startQuiz);
    document.getElementById('settings-btn').addEventListener('click', backToQuizSetup);
  }

  function renderAchievements() {
    const app = document.getElementById('app');

    const tilesHtml = ACHIEVEMENT_GROUPS.map(group => {
      const ids = achievementIdsForGroup(group);
      const unlockedCount = ids.filter(id => state.progress.achievements[id] && state.progress.achievements[id].unlocked).length;
      return `
        <button class="game-tile" data-group="${group.id}">
          <div class="tile-icon-wrap" style="background:${group.color};">${group.icon}</div>
          <div class="tile-name">${esc(group.name)}</div>
          <div class="tile-meta">${unlockedCount}/${ids.length} unlocked</div>
        </button>
      `;
    }).join('');

    app.innerHTML = `
      <div class="screen bg-achievements">
        <div class="wrap">
          <div class="screen-header">
            <button id="back-btn" class="back-btn">←</button>
            <div class="screen-title">🏆 Achievements</div>
          </div>
          <div class="game-grid">${tilesHtml}</div>
        </div>
      </div>
    `;

    document.getElementById('back-btn').addEventListener('click', goHome);
    document.querySelectorAll('.game-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        state.achievementGroup = tile.dataset.group;
        state.screen = 'achievements-detail';
        render();
      });
    });
  }

  function renderAchievementGroup() {
    const app = document.getElementById('app');
    const group = ACHIEVEMENT_GROUPS.find(g => g.id === state.achievementGroup) || ACHIEVEMENT_GROUPS[0];
    const ids = achievementIdsForGroup(group);

    const itemsHtml = ids.map(id => {
      const def = ACHIEVEMENTS[id];
      const rec = state.progress.achievements[id];
      const unlocked = !!(rec && rec.unlocked);
      return `
        <div class="achievement-item ${unlocked ? 'unlocked' : 'locked'}">
          <div class="ach-icon">${unlocked ? def.icon : '🔒'}</div>
          <div class="ach-text">
            <div class="ach-name">${esc(def.name)}</div>
            <div class="ach-desc">${esc(def.desc)}</div>
          </div>
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="screen bg-achievements">
        <div class="wrap">
          <div class="screen-header">
            <button id="back-btn" class="back-btn">←</button>
            <div class="screen-title">${group.icon} ${esc(group.name)}</div>
          </div>
          <div class="card">
            ${itemsHtml}
          </div>
        </div>
      </div>
    `;
    document.getElementById('back-btn').addEventListener('click', () => { state.screen = 'achievements'; render(); });
  }

  function renderMyProgress() {
    const app = document.getElementById('app');
    const p = state.progress;

    const vocabAccuracy = p.lifetime.totalAnswered > 0
      ? Math.round((p.lifetime.totalCorrect / p.lifetime.totalAnswered) * 100) : 0;
    const conjAccuracy = p.conjugateLifetime.totalAnswered > 0
      ? Math.round((p.conjugateLifetime.totalCorrect / p.conjugateLifetime.totalAnswered) * 100) : 0;

    const wordCounts = boxCounts(p.wordStats);
    const verbCounts = boxCounts(p.verbStats);
    const wordMax = Math.max(1, ...wordCounts);
    const verbMax = Math.max(1, ...verbCounts);

    const barsHtml = (counts, max, colorClass) => counts.map((count, i) => {
      const heightPct = count > 0 ? Math.max((count / max) * 100, 6) : 2;
      return `
        <div class="progress-bar-col">
          <div class="progress-bar-count">${count}</div>
          <div class="progress-bar ${colorClass}" style="height:${heightPct}%"></div>
          <div class="progress-bar-label">${i + 1}</div>
        </div>
      `;
    }).join('');

    const reviewWords = lowestBoxWords(5);
    const reviewWordsHtml = reviewWords.length ? reviewWords.map(ws => `
      <div class="progress-review-item">
        <div>
          <div class="progress-review-word">${esc(ws.es)}</div>
          <div class="progress-review-en">${esc(ws.en)}</div>
        </div>
        <div class="progress-box-tag ${ws.box >= 2 ? 'mid' : ''}">Box ${ws.box + 1}</div>
      </div>
    `).join('') : `<div class="progress-empty">Nothing to review yet — play a round first.</div>`;

    const reviewCombos = lowestBoxVerbCombos(5);
    const reviewCombosHtml = reviewCombos.length ? reviewCombos.map(vs => `
      <div class="progress-review-item">
        <div>
          <div class="progress-review-word">${esc(vs.es)} <span class="progress-review-person">(${esc(PERSON_LABELS[vs.person])})</span></div>
          <div class="progress-review-en">${esc(vs.en || '')}</div>
        </div>
        <div class="progress-box-tag ${vs.box >= 2 ? 'mid' : ''}">Box ${vs.box + 1}</div>
      </div>
    `).join('') : `<div class="progress-empty">Nothing to review yet — play a Conjugate round first.</div>`;

    app.innerHTML = `
      <div class="screen bg-progress">
        <div class="wrap">
          <div class="screen-header">
            <button id="back-btn" class="back-btn">←</button>
            <div class="screen-title">📊 My Progress</div>
          </div>

          <div class="progress-summary-row">
            <div class="card progress-summary-card">
              <div class="progress-summary-eyebrow">Vocabulary</div>
              <div class="progress-summary-big">${p.lifetime.totalAnswered}</div>
              <div class="progress-summary-big-label">words answered</div>
              <div class="progress-summary-stat"><span>Accuracy</span><span>${vocabAccuracy}%</span></div>
              <div class="progress-summary-stat"><span>Streak</span><span>${p.streak.current} · best ${p.streak.best}</span></div>
            </div>
            <div class="card progress-summary-card conjugate">
              <div class="progress-summary-eyebrow">Conjugation</div>
              <div class="progress-summary-big">${p.conjugateLifetime.totalAnswered}</div>
              <div class="progress-summary-big-label">verb forms answered</div>
              <div class="progress-summary-stat"><span>Accuracy</span><span>${conjAccuracy}%</span></div>
              <div class="progress-summary-stat"><span>Streak</span><span>${p.conjugateStreak.current} · best ${p.conjugateStreak.best}</span></div>
            </div>
          </div>

          <div class="card" style="margin-top:14px;">
            <div class="progress-section-title">Box progress — Vocabulary</div>
            <div class="progress-section-sub">Box 6 words are the ones you've got locked in</div>
            <div class="progress-bars">${barsHtml(wordCounts, wordMax, '')}</div>
          </div>

          <div class="card" style="margin-top:14px;">
            <div class="progress-section-title">Box progress — Conjugation</div>
            <div class="progress-section-sub">Verb + pronoun combos, same 6-box system</div>
            <div class="progress-bars">${barsHtml(verbCounts, verbMax, 'conjugate')}</div>
          </div>

          <div class="card" style="margin-top:14px;">
            <div class="progress-section-title">Words to review</div>
            <div class="progress-section-sub">Lowest-box words right now</div>
            <div class="progress-review-list">${reviewWordsHtml}</div>
          </div>

          <div class="card" style="margin-top:14px; margin-bottom:14px;">
            <div class="progress-section-title">Verb combos to review</div>
            <div class="progress-section-sub">Lowest-box verb + pronoun pairs right now</div>
            <div class="progress-review-list">${reviewCombosHtml}</div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('back-btn').addEventListener('click', goHome);
  }

  function renderTimeAttack() {
    const app = document.getElementById('app');
    const current = state.taCurrentQuestion;
    if (!current) return;

    const promptWord = current.direction === 'es-en' ? current.es : current.en;
    const promptLang = current.direction === 'es-en' ? 'es-ES' : 'en-US';

    let bottomHtml;
    if (state.effectiveAnswerMode === 'choice' && state.taCurrentOptions) {
      let optHtml = '<div class="option-list" id="ta-options">';
      state.taCurrentOptions.forEach(opt => {
        optHtml += `<button class="option-btn">${esc(opt)}</button>`;
      });
      optHtml += '</div>';
      bottomHtml = optHtml;
    } else {
      bottomHtml = `
        <input id="ta-input" type="text" placeholder="Type the translation…" value="${esc(state.taInput)}" autocomplete="off" />
        <button id="ta-check-btn" class="btn-primary">Check</button>
      `;
    }

    app.innerHTML = `
      <div class="screen bg-timeattack">
        <div class="wrap">
          <div class="ta-header">
            <div class="ta-timer-track"><div class="ta-timer-fill" id="ta-timer-fill" style="width:${(state.taTimeLeft / 60 * 100)}%;"></div></div>
            <div class="ta-stats-row">
              <div class="ta-score-label">Score: <span id="ta-score">${state.taScore}</span></div>
              <div class="ta-timer-label" id="ta-timer">${state.taTimeLeft}s</div>
            </div>
          </div>
          <div class="prompt-card" id="ta-prompt-card">
            <div class="prompt-row">
              <div class="prompt-word">${esc(promptWord)}</div>
              <button id="ta-speak-btn" class="speak-btn" title="Hear it">🔊</button>
            </div>
          </div>
          ${bottomHtml}
          <button id="ta-quit-btn" class="quit-link" style="display:block; text-align:center; width:100%; margin-top:14px;">Quit</button>
        </div>
      </div>
    `;

    const speakBtn = document.getElementById('ta-speak-btn');
    speakBtn.addEventListener('click', () => speak(promptWord, promptLang, speakBtn));
    if (state.progress.settings.autoSpeak) speak(promptWord, promptLang, speakBtn);

    if (state.effectiveAnswerMode === 'choice' && state.taCurrentOptions) {
      document.querySelectorAll('#ta-options .option-btn').forEach((btn, i) => {
        btn.addEventListener('click', () => taSelectOption(state.taCurrentOptions[i]));
      });
    } else {
      const input = document.getElementById('ta-input');
      input.focus();
      input.addEventListener('input', (e) => { state.taInput = e.target.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.stopPropagation();
          handleTaTypedSubmit();
        }
      });
      document.getElementById('ta-check-btn').addEventListener('click', handleTaTypedSubmit);
    }

    document.getElementById('ta-quit-btn').addEventListener('click', () => {
      if (confirm('Quit this round? Your progress on it will be scored as-is.')) endTimeAttack();
    });
  }

  function renderTimeAttackResult() {
    const app = document.getElementById('app');
    const missed = state.results.filter(r => !r.correct);
    const best = state.progress.timeAttackBest || 0;

    let reviewHtml = '';
    if (missed.length > 0) {
      let itemsHtml = '';
      missed.slice(0, 20).forEach(r => {
        itemsHtml += `
          <div class="review-item">
            <span class="from">${esc(r.prompt)}</span> → <span class="to">${esc(r.correctAnswer)}</span>
          </div>
        `;
      });
      reviewHtml = `
        <div class="card" style="margin-bottom:20px;">
          <div class="review-title">Words to review</div>
          ${itemsHtml}
          ${missed.length > 20 ? `<div style="font-size:12px;color:var(--cream-dim);margin-top:8px;">+ ${missed.length - 20} more</div>` : ''}
        </div>
      `;
    }

    app.innerHTML = `
      <div class="screen bg-timeattack">
        <div class="wrap wrap-centered">
          <div class="screen-header">
            <button id="back-btn" class="back-btn">←</button>
          </div>
          <div class="screen-body">
            <div class="eyebrow" style="margin-bottom:4px;">Contra reloj</div>
            <div class="score-big" style="margin-bottom:8px;">${state.taScore}</div>
            <div class="streak-line">correct in 60 seconds</div>
            ${state.taIsNewBest ? `<div class="new-best">🏆 New best score!</div>` : `<div class="streak-line">Best: ${best}</div>`}
            ${reviewHtml}
            <button id="ta-again-btn" class="btn-primary" style="width:100%; margin-bottom:10px;">Play again</button>
            <button id="ta-settings-btn" class="btn-secondary" style="width:100%;">Change settings</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('back-btn').addEventListener('click', goHome);
    document.getElementById('ta-again-btn').addEventListener('click', startTimeAttack);
    document.getElementById('ta-settings-btn').addEventListener('click', backToTimeAttackSetup);
  }

  // Tracks the previous screen so render() can tell a real navigation
  // (scroll should jump to top) apart from an in-screen re-render like
  // checking a quiz answer or toggling the menu (scroll should stay put).
  let lastScreen = null;

  function render() {
    const isNewScreen = state.screen !== lastScreen;
    lastScreen = state.screen;

    if (state.screen === 'login') renderLogin();
    else if (state.screen === 'start') renderStart();
    else if (state.screen === 'quiz-setup') renderQuizSetup();
    else if (state.screen === 'categories') renderCategories();
    else if (state.screen === 'category-setup') renderCategorySetup();
    else if (state.screen === 'conjugate-setup') renderConjugateSetup();
    else if (state.screen === 'conjugate') renderConjugate();
    else if (state.screen === 'conjugate-result') renderConjugateResult();
    else if (state.screen === 'quiz') renderQuiz();
    else if (state.screen === 'timeattack-setup') renderTimeAttackSetup();
    else if (state.screen === 'timeattack') renderTimeAttack();
    else if (state.screen === 'memory-setup') renderMemorySetup();
    else if (state.screen === 'memory-play') renderMemoryPlay();
    else if (state.screen === 'memory-result') renderMemoryResult();
    else if (state.screen === 'celebrate') renderCelebrate();
    else if (state.screen === 'result') {
      if (state.resultMode === 'timeattack') renderTimeAttackResult();
      else renderResult();
    }
    else if (state.screen === 'achievements') renderAchievements();
    else if (state.screen === 'achievements-detail') renderAchievementGroup();
    else if (state.screen === 'my-progress') renderMyProgress();

    if (isNewScreen) window.scrollTo(0, 0);
  }

  // Single, stable listener for advancing on Enter from the feedback screen.
  // (Installed once — not re-created per render — so it can never stack up.)
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (state.screen === 'quiz' && state.checked) {
      nextQuestion();
    } else if (state.screen === 'conjugate' && state.conjugateChecked) {
      nextConjugateQuestion();
    }
  });

  // Checks for an existing signed-in session and decides login vs hub.
  // Independent of the word/verb list loading below — vocab data isn't
  // user-specific, so both can happen in parallel.
  initAuth();

  loadFromRepo();

  // Also load the verb list at startup, not just when Conjugate is opened.
  // My Progress's "verb combos to review" fallback lookup needs it in
  // memory to recover display text for legacy entries - without this it
  // only works once Conjugate has been opened at least once this session.
  loadVerbsFile();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {
        // Not fatal — the app still works online without it
      });
    });
  }

  // Flags that progress may be stale after using the app elsewhere (another
  // tab, another device). If already on the hub, syncs immediately; if not,
  // renderStart() picks the flag up as soon as the hub is next shown —
  // covers both "switched tabs while on the hub" and "switched tabs, then
  // navigated back to the hub afterward".
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.user) {
      state.needsCloudSync = true;
      if (state.screen === 'start') render();
    }
  });
</script>
</body>
</html>
